.alert{border-radius:9px;padding:10px 12px;font-size:14px}

.pre{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;color:#334155}

.tplbox li{margin:1px 0}
.tplsel{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 12px}
.tplopt{border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:#fff;font-size:13px}

.cap-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}

<script>
const fb={app:null,auth:null,fs:null};
const state={user:null,profile:null,tab:"resumen",pendingName:null,authMode:"login",
  projFilter:"activo",projSearch:"",
  pizarraSubtab:"hoy",pizarraFocus:"all",desempenoTab:"personas",
  calMonth:new Date().getMonth(),calYear:new Date().getFullYear(),
  dragging:null,_selTpl:null,_obsTpl:null};
const data={projects:[],tasks:[],comments:[],logs:[],users:[],boardItems:[],holidays:[],dayNotes:[]};
let unsubs=[];

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate=iso=>!iso?"—":new Date(iso+(iso.length<=10?"T00:00:00":"")).toLocaleDateString("es-PE",{day:"2-digit",month:"2-digit",year:"numeric"});
const fmtDT=iso=>{const d=new Date(iso);return d.toLocaleDateString("es-PE",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"});};
const today=()=>new Date().toLocaleDateString("es-PE",{day:"2-digit",month:"2-digit",year:"numeric"});
const todayISO=()=>isoOfDate(new Date());
const uById=id=>data.users.find(u=>u.id===id);
const pById=id=>data.projects.find(p=>p.id===id);
const cFor=tid=>data.comments.filter(c=>c.taskId===tid);
const initials=n=>{const p=(n||"?").trim().split(" ");return (p[p.length-1]||"?")[0].toUpperCase();};
const elapsedPct=p=>{if(!p||!p.startDate||!p.endDate)return 0;const s=new Date(p.startDate+"T00:00:00"),e=new Date(p.endDate+"T00:00:00"),n=new Date();if(n<=s)return 0;if(n>=e)return 100;return Math.round((n-s)/(e-s)*100);};
const statusFor=(r,e)=>{const d=r-e;return d>=-5?"verde":d>=-15?"amarillo":"rojo";};
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};
const valNum=id=>{const e=document.getElementById(id);return e?Number(e.value)||0:0;};
function isConfigured(){if(typeof firebase==="undefined")return false;const c=FIREBASE_CONFIG;return c.apiKey&&c.projectId&&!JSON.stringify(c).includes("PEGAR_AQUI");}
function isoOfDate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function getWeekStart(off=0){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+(off||0)*7);d.setHours(0,0,0,0);return d;}
function weekDays(start){const a=[];for(let i=0;i<6;i++){const d=new Date(start);d.setDate(d.getDate()+i);a.push(d);}return a;}
function isHoliday(iso){return data.holidays.some(h=>h.date===iso);}
function dayLabel(d){return ["DOM","LUN","MAR","MIÉ","JUE","VIE","SÁB"][d.getDay()];}
function dailyCapacity(iso){const d=new Date(iso+"T00:00:00");const day=d.getDay();if(day===0)return 0;if(day===6)return 4.5;return 8;}
function weeklyCapacity(){return 8*5+4.5;}
function previousWorkDay(iso){
  let d=new Date(iso+"T00:00:00");
  for(let i=0;i<14;i++){
    d.setDate(d.getDate()-1);
    const c=isoOfDate(d);
    if(d.getDay()!==0&&!isHoliday(c))return c;
  }
  return null;
}

window.addEventListener("DOMContentLoaded",()=>{
  if(!isConfigured()){document.getElementById("app").innerHTML='<div style="padding:30px;text-align:center"><p>Configuración pendiente.</p></div>';return;}
  try{fb.app=firebase.initializeApp(FIREBASE_CONFIG);fb.auth=firebase.auth();fb.fs=firebase.firestore();}catch(e){console.error(e);return;}
  fb.auth.onAuthStateChanged(async user=>{
    if(user){state.user=user;try{state.profile=await ensureProfile(user);}catch(e){console.error(e);}
      attachListeners();state.tab="resumen";render();}
    else{state.user=null;state.profile=null;detachListeners();renderLogin();}
  });
  bindEvents();
});

async function ensureProfile(user){
  const ref=fb.fs.collection("users").doc(user.uid);
  const snap=await ref.get();
  const isJefe=(JEFE_EMAILS||[]).map(e=>(e||"").toLowerCase()).includes((user.email||"").toLowerCase());
  if(!snap.exists){
    const prof={name:state.pendingName||(user.email||"Usuario").split("@")[0],email:user.email||"",role:isJefe?"jefe":"colaborador",status:isJefe?"aprobado":"pendiente",area:""};
    await ref.set(prof);state.pendingName=null;return {id:user.uid,...prof};
  }
  const prof=snap.data();
  if(isJefe&&prof.role!=="jefe"){await ref.update({role:"jefe",status:"aprobado"});prof.role="jefe";prof.status="aprobado";}
  if(!prof.status)await ref.update({status:"aprobado"});
  return {id:user.uid,...prof};
}
async function aprobarUsuario(uid){
  await fb.fs.collection("users").doc(uid).update({status:"aprobado"});
  const u=uById(uid);addLog(`Aprobó acceso de ${u?.name||uid}`);
}
async function rechazarUsuario(uid){
  if(!confirm("¿Rechazar y eliminar este acceso? El usuario no podrá entrar al sistema."))return;
  await fb.fs.collection("users").doc(uid).update({status:"rechazado"});
  const u=uById(uid);addLog(`Rechazó acceso de ${u?.name||uid}`);
}
async function doLogin(){const em=val("li-email"),pw=val("li-pass");if(!em||!pw)return showErr("Escribe correo y contraseña.");try{await fb.auth.signInWithEmailAndPassword(em,pw);}catch(e){showErr(traduce(e.code));}}
async function doRegister(){const nm=val("rg-name"),em=val("rg-email"),pw=val("rg-pass");if(!nm||!em||!pw)return showErr("Completa nombre, correo y contraseña.");if(pw.length<6)return showErr("Mínimo 6 caracteres.");state.pendingName=nm;try{await fb.auth.createUserWithEmailAndPassword(em,pw);}catch(e){showErr(traduce(e.code));}}
function doLogout(){fb.auth.signOut();}
function traduce(c){const m={"auth/invalid-credential":"Correo o contraseña incorrectos.","auth/wrong-password":"Contraseña incorrecta.","auth/user-not-found":"No existe esa cuenta.","auth/email-already-in-use":"Correo ya registrado.","auth/invalid-email":"Correo no válido.","auth/weak-password":"Contraseña muy débil."};return m[c]||("Error: "+c);}
function showErr(m){const e=document.getElementById("authErr");if(e)e.textContent=m;}

function attachListeners(){
  detachListeners();const C=fb.fs;
  unsubs.push(C.collection("projects").onSnapshot(s=>{data.projects=s.docs.map(d=>({id:d.id,...d.data()}));render();},e=>console.error("projects",e)));
  unsubs.push(C.collection("tasks").onSnapshot(s=>{data.tasks=s.docs.map(d=>({id:d.id,...d.data()}));render();},e=>console.error("tasks",e)));
  unsubs.push(C.collection("comments").orderBy("createdAt","desc").onSnapshot(s=>{data.comments=s.docs.map(d=>({id:d.id,...d.data()}));render();},e=>console.error("comments",e)));
  unsubs.push(C.collection("logs").orderBy("at","desc").limit(150).onSnapshot(s=>{data.logs=s.docs.map(d=>({id:d.id,...d.data()}));render();},e=>console.error("logs",e)));
  unsubs.push(C.collection("users").onSnapshot(s=>{data.users=s.docs.map(d=>({id:d.id,...d.data()}));render();},e=>console.error("users",e)));
  unsubs.push(C.collection("board_items").onSnapshot(s=>{data.boardItems=s.docs.map(d=>({id:d.id,...d.data()}));render();},e=>console.error("board_items",e)));
  unsubs.push(C.collection("holidays").onSnapshot(s=>{data.holidays=s.docs.map(d=>({id:d.id,...d.data()}));render();},e=>console.error("holidays",e)));
  unsubs.push(C.collection("day_notes").onSnapshot(s=>{data.dayNotes=s.docs.map(d=>({id:d.id,...d.data()}));render();},e=>console.error("day_notes",e)));
}
function detachListeners(){unsubs.forEach(u=>{try{u();}catch(e){}});unsubs=[];}

async function addLog(msg){try{await fb.fs.collection("logs").add({who:state.profile.name,role:state.profile.role,msg,at:new Date().toISOString()});}catch(e){console.error(e);}}
async function addComment(tid,text,kind){await fb.fs.collection("comments").add({taskId:tid,authorId:state.user.uid,authorName:state.profile.name,role:state.profile.role,kind,text,createdAt:new Date().toISOString()});const t=data.tasks.find(x=>x.id===tid);if(t)addLog(`Comentó en ${t.specialty} (${pById(t.projectId)?.code||""})`);}
async function setRole(uid,r){await fb.fs.collection("users").doc(uid).update({role:r});const u=uById(uid);addLog(`Cambió rol de ${u?.name} a ${ROLE_LABEL[r]}`);}
function commentThread(cs){if(!cs.length)return `<div style="font-style:italic;color:var(--muted);font-size:13px">Sin comentarios aún.</div>`;
  return cs.map(c=>`<div class="commentbox"><div class="meta"><span class="who">${esc(c.authorName)}</span><span class="role ${c.role}">${ROLE_LABEL[c.role]||c.role}</span>${c.kind==="justificacion"?`<span class="role" style="background:#fef3c7;color:#92400e">Justificación</span>`:""}<span class="tm">${fmtDT(c.createdAt)}</span></div><p>${esc(c.text)}</p></div>`).join("");}
</script>
<script>
function setApp(h){document.getElementById("app").innerHTML=h;}
function ph(t,s,blue){return `<div class="ph ${blue?"blue":""}"><h2>${esc(t)}</h2>${s?`<p>${esc(s)}</p>`:""}</div>`;}

function render(){
  if(!state.user)return renderLogin();
  if(!state.profile)return;
  const status=state.profile.status||"aprobado";
  if(status==="pendiente"){
    return setApp(`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper)">
      <div class="card" style="max-width:420px;width:90%;text-align:center;padding:32px">
        <div style="font-size:48px;margin-bottom:12px">⏳</div>
        <h2 style="margin:0 0 8px">Acceso pendiente de aprobación</h2>
        <p style="color:var(--muted);margin:0 0 20px">Tu cuenta fue creada pero necesita ser aprobada por el jefe de proyecto antes de que puedas ingresar. Te avisarán cuando esté lista.</p>
        <p style="font-size:12px;color:var(--muted)">Sesión iniciada como <b>${esc(state.profile.email)}</b></p>
        <button class="btn line" onclick="doLogout()" style="margin-top:16px">Cerrar sesión</button>
      </div></div>`);
  }
  if(status==="rechazado"){
    return setApp(`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper)">
      <div class="card" style="max-width:420px;width:90%;text-align:center;padding:32px">
        <div style="font-size:48px;margin-bottom:12px">🚫</div>
        <h2 style="margin:0 0 8px">Acceso denegado</h2>
        <p style="color:var(--muted);margin:0 0 20px">Tu solicitud de acceso fue rechazada. Comunícate con el jefe de proyecto si crees que es un error.</p>
        <button class="btn line" onclick="doLogout()" style="margin-top:16px">Cerrar sesión</button>
      </div></div>`);
  }
  const role=state.profile.role,nav=NAV[role]||NAV.colaborador;
  const navBtns=nav.map(([id,lbl,ic])=>`<button data-act="tab" data-id="${id}" class="${state.tab===id?"active":""}">${ICONS[ic]}${lbl}</button>`).join("");
  setApp(`
  <div class="layout">
    <aside class="sb">
      <div class="sb-brand"><div class="sb-tag">● Control</div><div class="sb-title">Expedientes Técnicos</div></div>
      <nav class="nav"><button data-act="refresh">${ICONS.refresh}Actualizar</button>${navBtns}</nav>
      <div class="sb-foot">
        <div class="ucard"><div class="avatar">${initials(state.profile.name)}</div>
          <div style="min-width:0;flex:1"><div class="uname">${esc(state.profile.name)}</div><span class="role ${role}">${ROLE_LABEL[role]}</span></div></div>
        <button class="btn-ghost" data-act="logout">${ICONS.out} Cerrar sesión</button>
      </div>
    </aside>
    <div style="flex:1;min-width:0">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="avatar sm">${initials(state.profile.name)}</div>
          <div><div class="uname">${esc(state.profile.name)}</div><span class="role ${role}">${ROLE_LABEL[role]}</span></div>
          <button class="btn-ghost" style="margin:0;width:auto;margin-left:auto" data-act="logout">${ICONS.out}</button>
        </div>
        <div class="tnav"><button data-act="refresh">${ICONS.refresh}</button>${navBtns}</div>
      </div>
      <main class="content" id="view"></main>
    </div>
  </div>`);
  const v=document.getElementById("view");
  if(state.tab==="resumen"){v.innerHTML=viewResumen();}
  else if(state.tab==="proyectos")v.innerHTML=viewProyectos();
  else if(state.tab==="pizarra")v.innerHTML=viewPizarra();
  else if(state.tab==="calendario")v.innerHTML=viewCalendario();
  else if(state.tab==="desempeno")v.innerHTML=viewDesempeno();
  else if(state.tab==="equipo"&&role==="jefe")v.innerHTML=viewEquipo();
  else if(state.tab==="bitacora"&&role==="jefe")v.innerHTML=viewBitacora();
  else{v.innerHTML=viewResumen();}
}

function renderLogin(){
  const mode=state.authMode;
  setApp(`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px"><div style="background:#fff;border-radius:14px;padding:28px;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(15,23,42,.08)">
    <div style="font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)">● Control · Expedientes Técnicos</div>

    <p style="color:var(--muted);font-size:14px">Ingresa con tu cuenta.</p>
    <div style="display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:18px 0">
      <button data-act="authmode" data-id="login" style="flex:1;background:${mode==="login"?"var(--accent)":"#fff"};color:${mode==="login"?"#fff":"var(--muted)"};padding:9px">Iniciar sesión</button>
      <button data-act="authmode" data-id="register" style="flex:1;background:${mode==="register"?"var(--accent)":"#fff"};color:${mode==="register"?"#fff":"var(--muted)"};padding:9px">Registrarme</button>
    </div>
    ${mode==="login"?`
      <label class="fl"><span class="t">Correo</span><input id="li-email" type="email"/></label>
      <label class="fl"><span class="t">Contraseña</span><input id="li-pass" type="password"/></label>
      <button class="btn primary" style="width:100%" data-act="login">Entrar</button>`:`
      <label class="fl"><span class="t">Nombre completo</span><input id="rg-name"/></label>
      <label class="fl"><span class="t">Correo</span><input id="rg-email" type="email"/></label>
      <label class="fl"><span class="t">Contraseña</span><input id="rg-pass" type="password" placeholder="mínimo 6 caracteres"/></label>
      <button class="btn primary" style="width:100%" data-act="register">Crear mi cuenta</button>`}
    <div id="authErr" style="color:#b91c1c;font-size:13px;margin-top:8px"></div>
  </div></div>`);
}

/* ============ RESUMEN ============ */
function viewResumen(){
  const T=data.tasks,P=data.projects;
  const activos=P.filter(p=>p.status==="activo"||!p.status);
  const paralizados=P.filter(p=>p.status==="paralizado");
  const cerrados=P.filter(p=>p.status==="cerrado");
  const obs=P.filter(p=>p.status==="observacion");
  const espOf=t=>elapsedPct(pById(t.projectId)||{});
  const activeTasks=T.filter(t=>{const p=pById(t.projectId);return p&&(p.status==="activo"||p.status==="observacion"||!p.status);});
  const counts={verde:0,amarillo:0,rojo:0};let pend=0;
  activeTasks.forEach(t=>{counts[statusFor(t.pctReal||0,espOf(t))]++;pend+=(t.entregables||[]).filter(e=>!e.done).length;});
  const avg=activeTasks.length?Math.round(activeTasks.reduce((a,t)=>a+(t.pctReal||0),0)/activeTasks.length):0;
  const todayI=todayISO();
  const myToday=data.boardItems.filter(b=>b.userId===state.user.uid&&b.date===todayI);
  const sinReg=data.users.filter(u=>!data.boardItems.some(b=>b.userId===u.id&&b.date===todayI)).length;
  if(!P.length){
    return ph("Resumen Ejecutivo","Aún no hay expedientes cargados.",true)+
      `<div class="card"><div class="card-b" style="text-align:center"><p style="color:var(--muted)">No hay datos todavía.${state.profile.role==="jefe"?" Crea tu primer expediente en <b>Proyectos</b>.":""}</p></div></div>`;
  }
  const kpi=(ic,tone,lbl,v,sub)=>`<div class="kpi"><div class="ic" style="background:${tone[0]};color:${tone[1]}">${ICONS[ic]}</div><div class="lbl">${lbl}</div><div class="val">${v}</div><div class="sub">${sub}</div></div>`;

  // Gráfico 1: barras horizontales Avance real vs esperado por expediente (SVG puro)
  const allP=P.filter(p=>p.status==="activo"||p.status==="observacion"||!p.status);
  const projRows=allP.map(p=>{
    const pt=T.filter(t=>t.projectId===p.id);
    const real=pt.length?Math.round(pt.reduce((a,t)=>a+(t.pctReal||0),0)/pt.length):0;
    const esp=elapsedPct(p);
    return {name:p.code,label:p.name,real,esp};
  });
  const barChart=projRows.length?projRows.map(r=>{
    const realColor=r.real>=r.esp?"#10b981":r.real>=r.esp*0.7?"#f59e0b":"#ef4444";
    return `<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
        <span style="font-weight:600">${esc(r.name)}</span>
        <span style="color:var(--muted);font-size:11px">${esc(r.label.slice(0,30))}</span>
      </div>
      <div style="position:relative;height:20px;background:#e2e8f0;border-radius:6px;overflow:hidden">
        <div style="position:absolute;left:0;top:0;bottom:0;width:${Math.min(r.esp,100)}%;background:#cbd5e1;border-radius:6px"></div>
        <div style="position:absolute;left:0;top:3px;bottom:3px;width:${Math.min(r.real,100)}%;background:${realColor};border-radius:4px;z-index:1"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-top:2px">
        <span style="color:${realColor};font-family:var(--mono);font-weight:600">Real ${r.real}%</span>
        <span style="color:var(--muted)">Esp. ${r.esp}%</span>
      </div>
    </div>`;
  }).join(""):`<p style="color:var(--muted);font-size:13px">Sin expedientes activos.</p>`;

  // Gráfico 2: donut SVG para estado de frentes
  const total=counts.verde+counts.amarillo+counts.rojo||1;
  const R=70,CX=90,CY=90,circ=2*Math.PI*R;
  const seg=(val,color,offset)=>{
    const len=(val/total)*circ;
    return val>0?`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${color}" stroke-width="22"
      stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${circ-offset}" transform="rotate(-90 ${CX} ${CY})"/>`:"";
  };
  let off=0;
  const d1=seg(counts.verde,"#10b981",off);off+=(counts.verde/total)*circ;
  const d2=seg(counts.amarillo,"#f59e0b",off);off+=(counts.amarillo/total)*circ;
  const d3=seg(counts.rojo,"#ef4444",off);
  const donutSvg=`<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
    <svg viewBox="0 0 180 180" style="width:140px;height:140px;flex-shrink:0">
      <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#e2e8f0" stroke-width="22"/>
      ${d1}${d2}${d3}
      <text x="${CX}" y="${CY}-8" font-size="22" font-weight="700" text-anchor="middle" fill="var(--ink)" dy="8">${total}</text>
      <text x="${CX}" y="${CY}+16" font-size="11" text-anchor="middle" fill="var(--muted)" dy="22">frentes</text>
    </svg>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:8px"><div style="width:12px;height:12px;border-radius:50%;background:#10b981"></div><span style="font-size:13px">En meta</span><span style="font-family:var(--mono);font-weight:700;margin-left:auto;padding-left:12px">${counts.verde}</span></div>
      <div style="display:flex;align-items:center;gap:8px"><div style="width:12px;height:12px;border-radius:50%;background:#f59e0b"></div><span style="font-size:13px">En riesgo</span><span style="font-family:var(--mono);font-weight:700;margin-left:auto;padding-left:12px">${counts.amarillo}</span></div>
      <div style="display:flex;align-items:center;gap:8px"><div style="width:12px;height:12px;border-radius:50%;background:#ef4444"></div><span style="font-size:13px">Crítico</span><span style="font-family:var(--mono);font-weight:700;margin-left:auto;padding-left:12px">${counts.rojo}</span></div>
    </div>
  </div>`;

  return ph("Resumen Ejecutivo",`Control al ${today()} · ${activos.length} activos · ${paralizados.length} paralizados · ${cerrados.length} cerrados`,true)+`
  <div class="grid g5">
    ${kpi("build",["#dbeafe","#1d4ed8"],"Activos",activos.length,"en desarrollo")}
    ${kpi("dash",["#d1fae5","#047857"],"Avance global",avg+"%","de los activos")}
    ${kpi("hist",["#fee2e2","#b91c1c"],"Críticos",counts.rojo,"🔴 acción")}
    ${kpi("board",["#fef3c7","#b45309"],"Mi pizarra hoy",myToday.length,"tarjetas")}
    ${kpi("users",["#ede9fe","#6d28d9"],"Sin actividad hoy",sinReg,"del equipo")}
  </div>
  <div class="grid g3" style="margin-top:14px">
    <div class="card span2"><div class="card-h">📊 Avance por expediente — real vs. esperado</div><div class="card-b">${barChart}</div></div>
    <div class="card"><div class="card-h">📊 Estado de frentes</div><div class="card-b">${donutSvg}</div></div>
  </div>
  ${obs.length||paralizados.length?`
  <div class="grid g2" style="margin-top:14px">
    ${paralizados.length?`<div class="card"><div class="card-h">⏸️ Expedientes paralizados</div><div class="card-b">${paralizados.map(p=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="codetag paus">${esc(p.code)}</span> <b>${esc(p.name)}</b><div style="font-size:12px;color:var(--muted)">${esc(p.pauseReason||"Sin motivo registrado")}</div></div>`).join("")}</div></div>`:""}
    ${obs.length?`<div class="card"><div class="card-h">🔄 En observaciones</div><div class="card-b">${obs.map(p=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="codetag obs">${esc(p.code)}</span> <b>${esc(p.name)}</b></div>`).join("")}</div></div>`:""}
  </div>`:""}`;
}

/* ============ PROYECTOS ============ */
function viewProyectos(){
  const role=state.profile.role;
  const filter=state.projFilter;const q=state.projSearch.toLowerCase();
  let projs=data.projects.slice();
  if(filter==="mios")projs=projs.filter(p=>data.tasks.some(t=>t.projectId===p.id&&t.assigneeId===state.user.uid));
  else if(filter!=="all")projs=projs.filter(p=>(p.status||"activo")===filter);
  if(q)projs=projs.filter(p=>(p.code+" "+p.name).toLowerCase().includes(q));
  projs.sort((a,b)=>(a.code||"").localeCompare(b.code||""));
  const counts={activo:0,paralizado:0,cerrado:0,observacion:0,total:data.projects.length};
  data.projects.forEach(p=>counts[p.status||"activo"]++);
  let html=ph("Proyectos — Tablero de Control","% esperado por tiempo transcurrido. La línea marca el avance esperado.");
  html+=`<div class="filterbar">
    <button class="fchip ${filter==="activo"?"active":""}" data-act="pfilter" data-id="activo">🟢 Activos (${counts.activo})</button>
    <button class="fchip ${filter==="paralizado"?"active":""}" data-act="pfilter" data-id="paralizado">⏸️ Paralizados (${counts.paralizado})</button>
    <button class="fchip ${filter==="observacion"?"active":""}" data-act="pfilter" data-id="observacion">🔄 Observaciones (${counts.observacion})</button>
    <button class="fchip ${filter==="cerrado"?"active":""}" data-act="pfilter" data-id="cerrado">✅ Cerrados (${counts.cerrado})</button>
    <button class="fchip ${filter==="mios"?"active":""}" data-act="pfilter" data-id="mios">👤 Mis expedientes</button>
    <button class="fchip ${filter==="all"?"active":""}" data-act="pfilter" data-id="all">Todos (${counts.total})</button>
    <input id="psearch" placeholder="Buscar por código o nombre..." value="${esc(state.projSearch)}" style="margin-left:auto;max-width:260px"/>
    ${role==="jefe"?`<button class="btn primary sm" data-act="newproj">+ Nuevo expediente</button>`:""}
  </div>`;
  if(!projs.length)return html+`<div class="card"><div class="card-b" style="text-align:center"><p style="color:var(--muted)">No hay expedientes en esta vista.</p></div></div>`;
  projs.forEach(p=>{html+=renderProject(p,role);});
  return html;
}

function renderProject(p,role){
  const esp=elapsedPct(p),pt=data.tasks.filter(t=>t.projectId===p.id);
  const reals=pt.map(t=>t.pctReal||0);
  const avg=p.status==="cerrado"?(p.declaredPct||100):(reals.length?Math.round(reals.reduce((a,b)=>a+b,0)/reals.length):(p.declaredPct||0));
  const pst=STATUS[statusFor(avg,p.status==="cerrado"?100:esp)];
  const ps=PROJ_STATUS[p.status||"activo"];
  const responsables=[...new Set(pt.map(t=>t.assigneeId).filter(Boolean))].map(id=>uById(id)).filter(Boolean);
  const respMap={};pt.forEach(t=>{if(t.assigneeId){respMap[t.assigneeId]=(respMap[t.assigneeId]||0)+1;}});
  const tpl=p.template?TEMPLATES[p.template]:null;
  const cTagClass=p.status==="observacion"?"codetag obs":p.status==="paralizado"?"codetag paus":p.status==="cerrado"?"codetag cerr":"codetag";
  return `<section class="card" style="margin-bottom:18px;overflow:hidden">
    <div class="card-h" style="background:#f8fafc">
      <span class="${cTagClass}">${esc(p.code)}</span>
      <div style="flex:1;min-width:200px"><div>${esc(p.name)} ${tpl?`<span style="font-size:14px">${tpl.icon}</span>`:""}</div>
        <div style="font-size:12px;color:var(--muted)">${esc(p.location||"")}${p.startDate?` · ${fmtDate(p.startDate)} → ${fmtDate(p.endDate)}`:""}${tpl?` · ${tpl.name}`:p.status==="observacion"?" · Observación externa":""}</div></div>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <div style="text-align:right"><div style="font-size:10px;color:var(--muted);font-family:var(--mono)">tiempo</div><div class="mono" style="font-size:16px;font-weight:600">${esp}%</div></div>
        <div style="text-align:right"><div style="font-size:10px;color:var(--muted);font-family:var(--mono)">avance</div><div class="mono" style="font-size:16px;font-weight:600;color:${pst.hex}">${avg}%</div></div>
        <span class="chip ${ps.cls}">${ps.emoji} ${ps.lbl}</span>
        ${role==="jefe"?`<button class="btn line sm" data-act="editproj" data-id="${p.id}">Editar</button>`:""}
      </div>
    </div>
    ${responsables.length?`<div style="padding:10px 16px;background:#fafbfc;border-bottom:1px solid var(--line);font-size:12px">
      <b style="color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-size:10px">Trabajando en este expediente:</b>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
        ${responsables.map(u=>`<span style="display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px"><span class="avatar sm" style="background:var(--ink2)">${initials(u.name)}</span>${esc(u.name)} <span style="color:var(--muted);font-family:var(--mono);font-size:11px">${respMap[u.id]} ${respMap[u.id]>1?"frentes":"frente"}</span></span>`).join("")}
      </div></div>`:""}
    ${p.pauseReason&&p.status==="paralizado"?`<div style="padding:10px 16px;background:#fffbeb;border-bottom:1px solid var(--line);font-size:13px;color:#92400e"><b>Motivo de pausa:</b> ${esc(p.pauseReason)}</div>`:""}
    ${p.driveLink?`<div style="padding:8px 16px;background:#eff6ff;border-bottom:1px solid var(--line);font-size:12px">🔗 <b>Drive del expediente:</b> <a href="${esc(p.driveLink)}" target="_blank" style="word-break:break-all">${esc(p.driveLink)}</a></div>`:""}
    ${pt.length?`<div class="scroll"><table><thead><tr><th>Capítulo / Responsable</th><th>Esp.</th><th>Real</th><th>Desv.</th><th>Avance</th><th>Estado</th><th></th></tr></thead><tbody>
      ${pt.map(t=>rowTask(t,p.status==="cerrado"?100:esp)).join("")}
    </tbody></table></div>`:`<div class="card-b" style="text-align:center;color:var(--muted)"><p>Sin frentes registrados.</p>${role==="jefe"&&p.status!=="cerrado"?`<button class="btn line sm" data-act="addtask" data-id="${p.id}" style="margin-top:8px">+ Agregar frente</button>`:""}</div>`}
    ${role==="jefe"&&p.status!=="cerrado"&&pt.length?`<div style="padding:8px 16px;background:#f8fafc;border-top:1px solid var(--line)"><button class="btn line sm" data-act="addtask" data-id="${p.id}">+ Agregar capítulo</button></div>`:""}
  </section>`;
}

function rowTask(t,esp){
  const st=STATUS[statusFor(t.pctReal||0,esp)],u=uById(t.assigneeId),desv=(t.pctReal||0)-esp;
  return `<tr><td><div style="font-weight:500">${esc(t.specialty)}</div><div style="font-size:11px;color:var(--muted)">${esc(u?.name||t.assigneeName||"— sin asignar —")}</div></td>
  <td class="num" style="text-align:center">${esp}%</td><td class="num" style="text-align:center;font-weight:600">${t.pctReal||0}%</td>
  <td class="num diff ${desv<0?"neg":"pos"}" style="text-align:center">${desv>0?"+":""}${desv}%</td>
  <td><div style="width:120px"><div class="devbar"><div class="fill" style="width:${t.pctReal||0}%;background:${st.hex}"></div><div class="tick" style="left:${Math.min(esp,100)}%"></div></div></div></td>
  <td style="text-align:center"><span class="chip ${st.cls}"><span class="dot" style="background:${st.hex}"></span></span></td>
  <td><button class="btn line sm" data-act="opentask" data-id="${t.id}">ver</button></td></tr>`;
}
</script>
<script>
/* ============ PIZARRA ============ */
function viewPizarra(){
  const role=state.profile.role;
  let html=ph(role==="colaborador"?"Mi Pizarra":"Pizarra del Equipo",
    state.pizarraSubtab==="hoy"
      ?"Organiza tu día en tres columnas. Arrastra las tarjetas o usa los botones para moverlas."
      :"Vista de solo lectura: lo realizado y lo pendiente de cada día de la semana.");
  html+=`<div class="tabs">
    <button class="${state.pizarraSubtab==="hoy"?"active":""}" data-act="pztab" data-id="hoy">📋 Pizarra de hoy</button>
    <button class="${state.pizarraSubtab==="semana"?"active":""}" data-act="pztab" data-id="semana">📅 Resumen semanal</button>
  </div>`;
  if(state.pizarraSubtab==="hoy")html+=renderPizarraHoy(role);
  else html+=renderResumenSemanal(role);
  return html;
}

function renderPizarraHoy(role){
  const todayI=todayISO();
  const fer=isHoliday(todayI);
  let html="";
  if(fer)html+=`<div class="alert warn" style="margin-bottom:14px">📅 Hoy está marcado como <b>feriado</b>. Igual puedes registrar si trabajaste.</div>`;

  // Aviso de tarjetas pendientes del día hábil anterior (solo para mí)
  const prevDay=previousWorkDay(todayI);
  if(prevDay){
    const pending=data.boardItems.filter(b=>b.userId===state.user.uid&&b.date===prevDay&&b.col!=="done"&&!b.discarded&&!b.carriedOver);
    if(pending.length){
      html+=`<div class="card" style="margin-bottom:14px;border-color:#fde68a">
        <div class="card-h" style="background:#fffbeb">📌 Tienes ${pending.length} tarea${pending.length>1?"s":""} sin terminar de ${fmtDate(prevDay)}</div>
        <div class="card-b">
          ${pending.map(it=>{const colLbl={todo:"📋 Por hacer",doing:"🔨 Haciendo"}[it.col]||it.col;return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px">
            <span style="flex:1">${esc(it.text)} <span style="color:var(--muted);font-size:11px">(${colLbl}${it.pct?` · ${it.pct}%`:""})</span></span>
            <button class="btn line sm" onclick="continuePending('${it.id}','${todayI}')">Continuar hoy</button>
            <button class="btn line sm" onclick="discardPending('${it.id}')">Descartar</button>
          </div>`;}).join("")}
          <button class="btn primary sm" style="margin-top:10px" onclick="continueAllPending('${prevDay}','${todayI}')">Continuar todas hoy</button>
        </div>
      </div>`;
    }
  }

  const renderPersonBoard=(u,canInteract)=>{
    const items=data.boardItems.filter(b=>b.userId===u.id&&b.date===todayI);
    const byCol={};BOARD_COLS.forEach(c=>byCol[c.id]=[]);
    items.forEach(it=>{(byCol[it.col]||byCol.todo).push(it);});
    const isMe=u.id===state.user.uid;
    const hasActivity=items.length>0;
    const cap=dailyCapacity(todayI);
    const capLabel=cap===4.5?"Sábado · 4.5h":"Jornada · 8h";

    // Panel "Mis frentes asignados" — solo para la propia persona
    let frentesHtml="";
    if(canInteract&&isMe){
      const todayItems=items;
      const myTasks=data.tasks.filter(t=>{
        const p=pById(t.projectId);
        if(!p||p.status==="cerrado")return false;
        const subs=t.subItems||[];
        if(subs.length>0)return subs.some(s=>s.assigneeId===u.id&&(s.pctReal||0)<100);
        return t.assigneeId===u.id&&(t.pctReal||0)<100;
      });
      if(myTasks.length){
        const taskItems=myTasks.map(t=>{
          const p=pById(t.projectId)||{};
          const tplIcon=TEMPLATES[p.template]?.icon||"📁";
          const subs=t.subItems||[];
          if(subs.length>0){
            const mySubs=subs.map((s,i)=>{
              if(s.assigneeId!==u.id||(s.pctReal||0)>=100)return "";
              const subItemId=`${t.id}_${i}`;
              const already=todayItems.find(b=>b.subItemId===subItemId&&b.col!=="done");
              const done=todayItems.find(b=>b.subItemId===subItemId&&b.col==="done");
              const pct=s.pctReal||0;
              const pctColor=pct>=80?"var(--green)":pct>=40?"var(--amber)":"var(--muted)";
              return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0 5px 12px;border-bottom:1px solid var(--line)">
                <span style="font-size:11px;color:var(--muted)">└</span>
                <div style="flex:1;min-width:0">
                  <div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.name)}</div>
                  <div style="display:flex;align-items:center;gap:4px;margin-top:2px">
                    <div class="devbar" style="width:60px;height:4px"><div class="fill" style="width:${pct}%;background:${pctColor}"></div></div>
                    <span style="font-family:var(--mono);font-size:10px;color:${pctColor}">${pct}%</span>
                  </div>
                </div>
                ${done?`<span style="font-size:11px;color:var(--green);white-space:nowrap">✅ hecho</span>`
                  :already?`<span style="font-size:11px;color:var(--accent);white-space:nowrap">🔨 activo</span>`
                  :`<button class="btn line sm" onclick="activarSubItemHoy('${t.id}',${i})" style="font-size:11px;white-space:nowrap">Activar →</button>`}
              </div>`;
            }).filter(Boolean).join("");
            if(!mySubs)return "";
            return `<div style="border-bottom:1px solid var(--line)">
              <div style="display:flex;align-items:center;gap:8px;padding:7px 0">
                <span style="font-size:14px">${tplIcon}</span>
                <div><div style="font-size:13px;font-weight:600">${esc(t.specialty)}</div>
                <div style="font-size:11px;color:var(--muted)">${esc(p.code||"")} · ${esc(p.name||"")}</div></div>
              </div>${mySubs}</div>`;
          } else {
            const already=todayItems.find(b=>b.taskId===t.id&&b.col!=="done");
            const done=todayItems.find(b=>b.taskId===t.id&&b.col==="done");
            const pct=t.pctReal||0;
            const pctColor=pct>=80?"var(--green)":pct>=40?"var(--amber)":"var(--muted)";
            return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)">
              <span style="font-size:16px">${tplIcon}</span>
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.specialty)}</div>
                <div style="font-size:11px;color:var(--muted)">${esc(p.code||"")} · ${esc(p.name||"")}</div>
                <div style="display:flex;align-items:center;gap:6px;margin-top:3px">
                  <div class="devbar" style="width:80px;height:5px"><div class="fill" style="width:${pct}%;background:${pctColor}"></div></div>
                  <span style="font-family:var(--mono);font-size:11px;color:${pctColor}">${pct}%</span>
                </div>
              </div>
              ${done?`<span style="font-size:11px;color:var(--green);font-weight:500;white-space:nowrap">✅ hecho</span>`
                :already?`<span style="font-size:11px;color:var(--accent);font-weight:500;white-space:nowrap">🔨 activo</span>`
                :`<button class="btn line sm" onclick="activarFrenteHoy('${t.id}')" style="white-space:nowrap">Activar →</button>`}
            </div>`;
          }
        }).filter(Boolean).join("");
        if(taskItems)frentesHtml=`<div style="background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px">
          <div style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;margin-bottom:4px">📂 Mis frentes asignados</div>
          ${taskItems}
        </div>`;
      }
    }

    return `<div class="persongroup" style="${!canInteract?"opacity:0.85":""}">
      <div class="persongroup-h">
        <div class="avatar sm">${initials(u.name)}</div><b>${esc(u.name)}</b>
        ${isMe?'<span class="role colaborador">tú</span>':""}
        ${!canInteract?'<span style="font-size:11px;color:var(--muted);margin-left:4px">👁️ solo lectura</span>':""}

function renderBoardCard(it,canDrag){
  const p=it.projectId?pById(it.projectId):null;
  const tagLabels={plan:"Planificada",extra:"Extra",obs:"Observación",bloq:"Bloqueado"};
  const tag=it.tag||"plan";
  const pct=it.col==="done"?100:(it.pct||0);

  return `<div class="bcard" draggable="${canDrag}" ondragstart="state.dragging='${it.id}';this.classList.add('drag')" ondragend="this.classList.remove('drag');state.dragging=null" onclick="openBoardItem('${it.id}','${it.userId}','${it.date}')">

    <div class="ktitle">${esc(it.text)}</div>

    <div class="kmeta">${p?`<span class="codetag" style="background:var(--ink2);padding:1px 5px">${esc(p.code)}</span>`:""}${it.link?` 🔗`:""}</div>

async function dropBoardItem(col,ownerId){
  if(!state.dragging)return;
  const it=data.boardItems.find(x=>x.id===state.dragging);if(!it){state.dragging=null;return;}
  if(it.userId!==state.user.uid&&state.profile.role!=="jefe"){alert("Solo el dueño o el jefe pueden mover esta tarjeta.");state.dragging=null;return;}
  try{
    const pct=col==="done"?100:(it.pct||0);
    await fb.fs.collection("board_items").doc(it.id).update({col,pct,updatedAt:new Date().toISOString()});
    if(it.taskId)await syncTaskFromBoardItem(it.taskId,pct,it.subItemId||null);
  }catch(e){alert("Error: "+e.message);}
  state.dragging=null;
}

async function syncTaskFromBoardItem(taskId,pct,subItemId){
  if(!taskId)return;
  try{
    const t=data.tasks.find(x=>x.id===taskId);
    if(!t)return;
    const subs=t.subItems||[];
    if(subItemId&&subs.length){
      // Actualizar el sub-inciso específico y recalcular el global
      const newSubs=subs.map((s,i)=>{
        const sid=`${taskId}_${i}`;
        if(sid===subItemId)return {...s,pctReal:pct};
        return s;
      });
      const globalPct=Math.round(newSubs.reduce((a,s)=>a+(s.pctReal||0),0)/newSubs.length);
      await fb.fs.collection("tasks").doc(taskId).update({
        subItems:newSubs,pctReal:globalPct,
        updatedAt:new Date().toISOString(),updatedBy:state.profile.name
      });
    } else {
      // Sin sub-incisos: actualizar directamente el capítulo
      await fb.fs.collection("tasks").doc(taskId).update({
        pctReal:pct,updatedAt:new Date().toISOString(),updatedBy:state.profile.name
      });
    }
  }catch(e){/*silencioso*/}
}
async function saveBoardItem(id,userId,date){
  const text=val("bi-text");if(!text)return alert("Escribe una descripción.");
  const projectId=document.getElementById("bi-proj").value||null;
  const tag=document.getElementById("bi-tag").value;
  const pctEl=document.getElementById("bi-pct");
  const pct=pctEl?Number(pctEl.value)||0:0;
  const link=val("bi-link");
  const u=uById(userId);
  const existing=id?data.boardItems.find(x=>x.id===id):null;
  try{
    if(id)await fb.fs.collection("board_items").doc(id).update({text,projectId,tag,pct,link,updatedAt:new Date().toISOString()});
    else await fb.fs.collection("board_items").add({userId,userName:u?.name||"",date,text,projectId,tag,pct,link,col:"todo",createdBy:state.profile.name,createdAt:new Date().toISOString()});
    if(existing?.taskId)await syncTaskFromBoardItem(existing.taskId,pct,existing.subItemId||null);
    addLog(`${id?"Editó":"Creó"} tarjeta de ${u?.name}: "${text.slice(0,40)}"`);
    closeModal();
  }catch(e){alert("Error: "+e.message);}
}
async function moveBoardItem(id,col){
  const it=data.boardItems.find(x=>x.id===id);if(!it)return;
  try{
    const payload={col,updatedAt:new Date().toISOString()};
    if(col==="done")payload.pct=100;
    else if(it.col==="done"&&col==="doing")payload.pct=90;
    const text=document.getElementById("bi-text");if(text)payload.text=text.value.trim();
    const link=document.getElementById("bi-link");if(link)payload.link=link.value.trim();
    const pctEl=document.getElementById("bi-pct");if(pctEl&&col!=="done"&&it.col!=="done")payload.pct=Number(pctEl.value)||0;
    await fb.fs.collection("board_items").doc(id).update(payload);
    if(it.taskId)await syncTaskFromBoardItem(it.taskId,payload.pct!==undefined?payload.pct:it.pct||0,it.subItemId||null);
    addLog(`${col==="done"?"Completó":col==="doing"&&it.col==="done"?"Reabrió":"Movió"} la tarea "${(it.text||"").slice(0,40)}"`);
    closeModal();
  }catch(e){alert("Error: "+e.message);}
}

      userId:it.userId,userName:it.userName||"",date:todayI,text:it.text,projectId:it.projectId||null,
      tag:it.tag||"plan",pct:it.pct||0,link:it.link||"",col:it.col==="doing"?"doing":"todo",
      continuedFrom:it.id,createdBy:state.profile.name,createdAt:new Date().toISOString()
    });

async function continueAllPending(prevDay,todayI){

/* ============ RESUMEN SEMANAL (solo lectura) ============ */
function renderResumenSemanal(role){
  const start=getWeekStart(0),days=weekDays(start);
  let users=data.users.filter(u=>u.role!=="supervisor");
  if(role==="colaborador"){
    const me=users.filter(u=>u.id===state.user.uid);
    const others=users.filter(u=>u.id!==state.user.uid);
    users=[...me,...others];
  }
  let html=`<div class="filterbar"><b>Semana del ${fmtDate(isoOfDate(days[0]))} al ${fmtDate(isoOfDate(days[5]))}</b></div>`;
  html+=`<div class="scroll"><div class="weekgrid" style="grid-template-columns:140px repeat(6,1fr) 90px"><div class="wh">Persona</div>${days.map(d=>{const iso=isoOfDate(d);const fer=isHoliday(iso);const isToday=iso===todayISO();return `<div class="wh" style="${fer?"background:#fef2f2;color:#dc2626":isToday?"background:#eff6ff;color:var(--accent)":""}">${dayLabel(d)}<br><span style="font-family:var(--mono);font-weight:400">${d.getDate()}/${d.getMonth()+1}</span>${fer?"<br>FERIADO":""}</div>`;}).join("")}<div class="wh" style="background:#f0fdf4">TOTAL<br>SEMANA</div>`;
  users.forEach(u=>{
    const isMe=u.id===state.user.uid;
    html+=`<div class="wname" style="${isMe?"background:#eff6ff;font-weight:600":""}"><div class="avatar sm">${initials(u.name)}</div>${esc(u.name)}${isMe?" (tú)":""}</div>`;
    let weekDone=0,weekTotal=0,weekAutoHours=0,weekWeighted=0;
    days.forEach(d=>{
      const iso=isoOfDate(d);
      const fer=isHoliday(iso);
      const isToday=iso===todayISO();
      const items=data.boardItems.filter(b=>b.userId===u.id&&b.date===iso);
      const done=items.filter(i=>i.col==="done").length;
      const total=items.length;
      const dayCap=dailyCapacity(iso);
      const dayWorked=total>0;
      if(dayWorked&&!fer)weekAutoHours+=dayCap;
      const dayWeightedSum=items.reduce((a,b)=>a+(b.col==="done"?100:(b.pct||0)),0);
      const dayPct=total?Math.round(dayWeightedSum/total):0;
      weekDone+=done;weekTotal+=total;weekWeighted+=dayWeightedSum;
      let content="";
      if(fer){content=`<span style="color:#dc2626;font-size:10px">Feriado</span>`;}
      else if(total===0){content=`<span style="color:var(--muted);font-size:10px">—</span>`;}
      else{
        const color=dayPct===100?"var(--green)":dayPct>=50?"var(--amber)":"var(--red)";
        content=`<div style="font-family:var(--mono);font-size:16px;font-weight:700;color:${color}">${dayPct}%</div>
          <div class="devbar" style="height:4px;margin:3px 6px 0"><div class="fill" style="width:${dayPct}%;background:${color}"></div></div>
          <div style="font-size:9px;color:var(--muted);margin-top:2px">${done}/${total} completadas</div>
          <div style="font-size:9px;color:var(--green);font-weight:600;margin-top:1px">✅ ${dayCap}h</div>`;
      }
      html+=`<div class="weekcell" style="${fer?"background:#fef9f9":isToday?"background:#eff6ff":""};padding:6px" onclick="openDaySummary('${u.id}','${iso}')">${content}</div>`;
    });
    const weekPct=weekTotal?Math.round(weekWeighted/weekTotal):0;
    const wColor=weekPct>=80?"var(--green)":weekPct>=50?"var(--amber)":weekTotal===0?"var(--muted)":"var(--red)";
    const wCap=weeklyCapacity();
    const hoursPct=wCap?Math.round(weekAutoHours/wCap*100):0;
    const hColor=hoursPct>=80?"var(--green)":hoursPct>=50?"var(--amber)":"var(--muted)";
    html+=`<div class="weekcell" style="background:#f0fdf4;padding:6px;border-left:2px solid var(--green)">
      <div style="font-family:var(--mono);font-size:16px;font-weight:700;color:${wColor}">${weekTotal?weekPct+"%":"—"}</div>
      <div style="font-size:9px;color:var(--muted);margin-top:2px">${weekDone}/${weekTotal} completadas</div>
      <div style="font-family:var(--mono);font-size:12px;font-weight:700;color:${hColor};margin-top:3px">${weekAutoHours}h / ${wCap}h</div>
      <div class="devbar" style="height:4px;margin:2px 0 0"><div class="fill" style="width:${hoursPct}%;background:${hColor}"></div></div>
    </div>`;
  });
  html+=`</div></div>`;
  html+=`<p style="font-size:12px;color:var(--muted);margin-top:10px">Click en una celda para ver el detalle. Para registrar o editar, ve a <b>Pizarra de hoy</b>.</p>`;
  return html;
}

  const u=uById(userId);
  const items=data.boardItems.filter(b=>b.userId===userId&&b.date===iso);
  const fer=isHoliday(iso);
  document.getElementById("modal").innerHTML=`<div class="modal"><div class="modal-c">
    <div class="modal-h"><h3>${esc(u?.name||"")} · ${iso.split("-").reverse().join("/")}</h3>${fer?'<span class="chip r">Feriado</span>':""}<button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      ${items.length?items.map(it=>{const p=it.projectId?pById(it.projectId):null;const colLbl={todo:"📋 Por hacer",doing:"🔨 Haciendo",done:"✅ Completado"}[it.col]||it.col;const pct=it.col==="done"?100:(it.pct||0);return `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(it.text)}</b><div style="font-size:12px;color:var(--muted);margin-top:2px">${colLbl}${it.col!=="todo"?` · ${pct}%`:""}${p?` · ${esc(p.code)}`:""}${it.link?` · <a href="${esc(it.link)}" target="_blank">link</a>`:""}</div></div>`;}).join(""):'<p style="color:var(--muted)">Sin tarjetas ese día.</p>'}
    </div>
    <div class="modal-f"><button class="btn line" onclick="closeModal()">Cerrar</button></div>
  </div></div>`;
}
function closeModal(){document.getElementById("modal").innerHTML="";}
</script>
<script>
/* ============ CALENDARIO ============ */
function viewCalendario(){
  const y=state.calYear,m=state.calMonth;
  const role=state.profile.role;
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  const offset=(first.getDay()+6)%7;
  const cells=[];for(let i=0;i<offset;i++)cells.push(null);
  for(let d=1;d<=last.getDate();d++)cells.push(new Date(y,m,d));
  while(cells.length%7)cells.push(null);
  const monthName=first.toLocaleDateString("es-PE",{month:"long",year:"numeric"});
  let html=ph("Calendario",role==="jefe"?"Click en un día para ver el detalle o marcar feriado.":"Verde = con tarjetas hechas · Rojo = sin completar.");
  html+=`<div class="filterbar">
    <button class="btn line sm" onclick="state.calMonth--;if(state.calMonth<0){state.calMonth=11;state.calYear--}render()">◀</button>
    <b style="margin:0 12px;text-transform:capitalize">${monthName}</b>
    <button class="btn line sm" onclick="state.calMonth++;if(state.calMonth>11){state.calMonth=0;state.calYear++}render()">▶</button>
    <button class="btn line sm" onclick="const n=new Date();state.calMonth=n.getMonth();state.calYear=n.getFullYear();render()" style="margin-left:auto">Hoy</button>
  </div>
  <div class="cal">
    ${["LUN","MAR","MIÉ","JUE","VIE","SÁB","DOM"].map(d=>`<div class="cal-h">${d}</div>`).join("")}
    ${cells.map(d=>{
      if(!d)return `<div class="cal-d off"></div>`;
      const iso=isoOfDate(d);
      const fer=isHoliday(iso);
      const isToday=iso===todayISO();
      const items=data.boardItems.filter(x=>x.date===iso);
      const myItems=items.filter(x=>x.userId===state.user.uid);
      const myDone=myItems.filter(x=>x.col==="done").length;
      const nolog=role==="colaborador"&&myItems.length===0&&iso<todayISO()&&!fer&&d.getDay()!==0;
      return `<div class="cal-d ${fer?"fer":""} ${isToday?"tod":""} ${nolog?"nolog":""}" onclick="openCalDay('${iso}')">
        <div class="dn">${d.getDate()}</div>
        ${fer?`<div style="font-size:9px;color:#dc2626;font-weight:600">FERIADO</div>`:""}
        ${items.length?`<div class="dl">✓ ${items.filter(x=>x.col==="done").length}/${items.length}</div>`:role==="colaborador"&&nolog?`<div class="dl">sin reg.</div>`:""}
      </div>`;
    }).join("")}
  </div>`;
  return html;
}
function openCalDay(iso){
  const role=state.profile.role;
  const fer=isHoliday(iso);
  const ferObj=data.holidays.find(h=>h.date===iso);
  const items=data.boardItems.filter(x=>x.date===iso);
  const byUser={};items.forEach(it=>{(byUser[it.userId]=byUser[it.userId]||[]).push(it);});
  document.getElementById("modal").innerHTML=`<div class="modal"><div class="modal-c">
    <div class="modal-h"><h3>${iso.split("-").reverse().join("/")}</h3>${fer?`<span class="chip r">FERIADO</span>`:""}<button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      ${role==="jefe"?`<div style="margin-bottom:14px">
        ${fer?`<button class="btn line sm" onclick="removeHoliday('${ferObj.id}')">Quitar feriado</button>${ferObj.name?`<span style="margin-left:10px;color:var(--muted)">${esc(ferObj.name)}</span>`:""}`:`<button class="btn warn sm" onclick="addHoliday('${iso}')">🔴 Marcar feriado</button>`}
      </div>`:""}
      ${Object.keys(byUser).length?Object.entries(byUser).map(([uid,its])=>{const u=uById(uid);return `<div style="margin-bottom:10px"><b style="font-size:13px">${esc(u?.name||"")}</b>${its.map(it=>{const p=it.projectId?pById(it.projectId):null;const colLbl={todo:"📋",doing:"🔨",done:"✅"}[it.col]||"";const pct=it.col==="done"?100:(it.pct||0);return `<div style="padding:4px 0;font-size:13px;color:var(--muted)">${colLbl} ${esc(it.text)}${it.col!=="todo"?` · ${pct}%`:""}${p?` · ${esc(p.code)}`:""}</div>`;}).join("")}</div>`;}).join(""):'<p style="color:var(--muted);font-size:13px">Sin registros ese día.</p>'}
    </div>
    <div class="modal-f"><button class="btn line" onclick="closeModal()">Cerrar</button></div>
  </div></div>`;
}
async function addHoliday(iso){
  const name=prompt("Nombre del feriado (opcional):","");
  try{await fb.fs.collection("holidays").add({date:iso,name:name||"",createdBy:state.profile.name,createdAt:new Date().toISOString()});addLog(`Marcó feriado ${iso}`);closeModal();}catch(e){alert("Error: "+e.message);}
}
async function removeHoliday(id){
  try{await fb.fs.collection("holidays").doc(id).delete();addLog(`Quitó feriado`);closeModal();}catch(e){alert("Error: "+e.message);}
}

/* ============ DESEMPEÑO ============ */
function viewDesempeno(){
  const users=data.users.filter(u=>u.role!=="supervisor");
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-30);
  const cutoffISO=isoOfDate(cutoff);
  let workDays=0;let expectedHours=0;
  for(let d=new Date(cutoff);d<=new Date();d.setDate(d.getDate()+1)){
    const iso=isoOfDate(d);
    const cap=dailyCapacity(iso);
    if(cap>0&&!isHoliday(iso)){workDays++;expectedHours+=cap;}
  }

  let html=ph("Desempeño del Equipo",`Últimos 30 días (${workDays} días hábiles · ${expectedHours}h esperadas). Jornada: L-V 8h + Sáb 4.5h.`);
  html+=`<div class="tabs">
    <button class="${state.desempenoTab==="personas"?"active":""}" data-act="dtab" data-id="personas">👤 Por persona</button>
    <button class="${state.desempenoTab==="dashboards"?"active":""}" data-act="dtab" data-id="dashboards">📊 Dashboards</button>
  </div>`;

  const statsOf=u=>{
    const items=data.boardItems.filter(b=>b.userId===u.id&&b.date>=cutoffISO);
    const allUserItems=data.boardItems.filter(b=>b.userId===u.id);
    const activeDays=new Set(items.map(b=>b.date));
    const daysWorked=activeDays.size;
    let autoHours=0;
    activeDays.forEach(iso=>{if(!isHoliday(iso))autoHours+=dailyCapacity(iso);});
    const totalItems=items.length;
    const doneItems=items.filter(b=>b.col==="done");
    const planned=items.filter(b=>b.tag!=="extra");
    const extras=items.filter(b=>b.tag==="extra");
    const blocked=items.filter(b=>b.tag==="bloq").length;
    const tasksAssigned=data.tasks.filter(t=>t.assigneeId===u.id);
    const avgProgress=tasksAssigned.length?Math.round(tasksAssigned.reduce((a,t)=>a+(t.pctReal||0),0)/tasksAssigned.length):0;
    const pctOf=(arr)=>arr.length?Math.round(arr.reduce((a,b)=>a+(b.col==="done"?100:(b.pct||0)),0)/arr.length):null;
    const avanceAcumPct=pctOf(items)??0;
    const cumplPct=pctOf(planned)??0;
    const extrasPct=pctOf(extras);
    // Tiempo de cierre: días entre creación (date) y completado (updatedAt), para items cerrados en la ventana
    let closureDaysSum=0,closureCount=0,parallelSum=0;
    doneItems.forEach(it=>{
      if(!it.updatedAt)return;
      const created=new Date(it.date+"T00:00:00");
      const closed=new Date(it.updatedAt);
      const days=Math.max(0,Math.round((closed-created)/86400000));
      closureDaysSum+=days;closureCount++;
      // carga simultánea: cuántas otras tareas (todo/doing) de esta persona existían en la fecha de creación de esta
      const parallel=allUserItems.filter(x=>x.id!==it.id&&x.date===it.date&&x.col!=="done").length;
      parallelSum+=parallel;
    });
    const avgClosureDays=closureCount?Math.round((closureDaysSum/closureCount)*10)/10:null;
    const avgParallel=closureCount?Math.round((parallelSum/closureCount)*10)/10:null;
    return {items,daysWorked,autoHours,totalItems,doneItems:doneItems.length,planned:planned.length,extras:extras.length,blocked,tasksAssigned:tasksAssigned.length,avgProgress,avanceAcumPct,cumplPct,extrasPct,avgClosureDays,avgParallel,closureCount,
      asistPct:workDays?Math.round(daysWorked/workDays*100):0,
      donePct:totalItems?Math.round(doneItems.length/totalItems*100):0,
      hoursPct:expectedHours?Math.round(autoHours/expectedHours*100):0};
  };
  const allStats=users.map(u=>({user:u,...statsOf(u)}));
  const barColor=v=>v>=80?"var(--green)":v>=50?"var(--amber)":"var(--red)";
  const bar=(pct,color)=>`<div class="devbar" style="height:6px;margin-top:4px"><div class="fill" style="width:${pct}%;background:${color||barColor(pct)}"></div></div>`;

  if(state.desempenoTab==="personas"){
    html+=`<div class="grid g2">`;
    allStats.forEach(s=>{
      const u=s.user;
      html+=`<div class="card"><div class="card-h"><div class="avatar sm">${initials(u.name)}</div>${esc(u.name)} <span class="role ${u.role}" style="margin-left:auto">${ROLE_LABEL[u.role]}</span></div>
        <div class="card-b">
          <div class="grid g4" style="gap:8px">
            <div style="padding:10px;background:#f8fafc;border-radius:8px">
              <div style="font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px">Asistencia</div>
              <div style="font-family:var(--mono);font-size:20px;font-weight:700;color:${barColor(s.asistPct)}">${s.asistPct}%</div>
              ${bar(s.asistPct)}
              <div style="font-size:10px;color:var(--muted);margin-top:4px">${s.daysWorked} de ${workDays} días</div>
            </div>
            <div style="padding:10px;background:#f8fafc;border-radius:8px">
              <div style="font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px">Cumplimiento</div>
              <div style="font-family:var(--mono);font-size:20px;font-weight:700;color:${barColor(s.cumplPct)}">${s.cumplPct}%</div>
              ${bar(s.cumplPct)}
              <div style="font-size:10px;color:var(--muted);margin-top:4px">${s.planned} planificadas (30 días)</div>
            </div>
            <div style="padding:10px;background:#f8fafc;border-radius:8px">
              <div style="font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px">Productividad</div>
              ${s.avgClosureDays===null
                ?`<div style="font-family:var(--mono);font-size:20px;font-weight:700;color:var(--muted)">—</div>
                  ${bar(0,"#e2e8f0")}
                  <div style="font-size:10px;color:var(--muted);margin-top:4px">Sin cierres aún (30 días)</div>`
                :`<div style="font-family:var(--mono);font-size:20px;font-weight:700;color:${s.avgClosureDays<=1?"var(--green)":s.avgClosureDays<=3?"var(--amber)":"var(--red)"}">${s.avgClosureDays===0?"Mismo día":s.avgClosureDays+"d"}</div>
                  ${bar(s.avgClosureDays<=1?100:s.avgClosureDays<=3?60:25,s.avgClosureDays<=1?"var(--green)":s.avgClosureDays<=3?"var(--amber)":"var(--red)")}
                  <div style="font-size:10px;color:var(--muted);margin-top:4px">${s.closureCount} cerradas · prom. ${s.avgParallel} abiertas a la vez</div>`}
            </div>
            <div style="padding:10px;background:#f8fafc;border-radius:8px">
              <div style="font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px">Avance acum.</div>
              <div style="font-family:var(--mono);font-size:20px;font-weight:700;color:${barColor(s.avanceAcumPct)}">${s.avanceAcumPct}%</div>
              ${bar(s.avanceAcumPct)}
              <div style="font-size:10px;color:var(--muted);margin-top:4px">incluye planificadas + extras</div>
            </div>
          </div>
          <div style="margin-top:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center">
            <div style="padding:6px;background:#f0fdf4;border-radius:6px"><div style="font-family:var(--mono);font-weight:700;font-size:14px;color:${barColor(s.hoursPct)}">${s.hoursPct}%</div><div style="font-size:9px;color:var(--muted)">${s.autoHours}h de ${expectedHours}h</div></div>
            <div style="padding:6px;background:#f0fdf4;border-radius:6px"><div style="font-family:var(--mono);font-weight:700;font-size:14px;color:#047857">${s.daysWorked}</div><div style="font-size:9px;color:var(--muted)">días trabajados</div></div>
            <div style="padding:6px;background:#fef3c7;border-radius:6px"><div style="font-family:var(--mono);font-weight:700;font-size:14px;color:${s.extrasPct===null?"var(--muted)":"#92400e"}">${s.extrasPct===null?"—":s.extrasPct+"%"}</div><div style="font-size:9px;color:var(--muted)">Avance extras (${s.extras})</div></div>
            <div style="padding:6px;background:${s.blocked?"#fee2e2":"#f8fafc"};border-radius:6px"><div style="font-family:var(--mono);font-weight:700;font-size:14px;color:${s.blocked?"#b91c1c":"var(--muted)"}">${s.blocked}</div><div style="font-size:9px;color:var(--muted)">Bloqueadas</div></div>
          </div>
          ${s.tasksAssigned?`<div style="margin-top:10px;padding:8px;background:#eff6ff;border-radius:6px;font-size:12px;color:#1e40af">
            📂 <b>${s.tasksAssigned} frentes</b> asignados · Avance promedio: <b>${s.avgProgress}%</b>
            ${bar(s.avgProgress,"var(--accent)")}
          </div>`:""}
          ${s.items.length===0?`<div class="alert warn" style="margin-top:10px;font-size:12px">⚠️ Sin actividad en los últimos 30 días</div>`:""}
        </div></div>`;
    });
    html+=`</div>`;
  } else {
    // Panel 1: Asistencia real vs esperada (barra doble)
    const attendanceBar=(s)=>{
      const pct=workDays?Math.min(Math.round(s.daysWorked/workDays*100),100):0;
      const color=pct>=80?"#10b981":pct>=50?"#f59e0b":"#ef4444";
      return `<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
          <span>${esc(s.user.name)}</span>
          <span style="font-family:var(--mono);font-weight:600;color:${color}">${s.daysWorked} de ${workDays} días</span>
        </div>
        <div class="devbar" style="height:12px;position:relative;background:#e2e8f0;overflow:hidden">
          <div style="position:absolute;inset:0;background:repeating-linear-gradient(45deg,#cbd5e1 0,#cbd5e1 4px,transparent 4px,transparent 8px)"></div>
          <div class="fill" style="position:absolute;left:0;top:0;bottom:0;height:100%;width:${pct}%;background:${color};z-index:1;border-radius:999px"></div>
        </div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px">${s.autoHours}h de ${expectedHours}h esperadas</div>
      </div>`;
    };

    // Panel 2: bubble chart Cumplimiento (X) vs Avance Acumulado (Y), tamaño = total de tareas
    const SW=600,SH=380,PAD=44;
    const sx=v=>PAD+(v/100)*(SW-2*PAD);
    const sy=v=>(SH-PAD)-(v/100)*(SH-2*PAD);
    const midX=sx(50),midY=sy(50);
    const maxItems=Math.max(1,...allStats.map(s=>s.totalItems));
    const positioned=allStats.map(s=>({s,x:sx(s.cumplPct),y:sy(s.avanceAcumPct)}));
    const labelOffsets=positioned.map((p,i)=>{
      let stack=0;
      positioned.forEach((q,j)=>{if(j<i&&Math.abs(q.x-p.x)<28&&Math.abs(q.y-p.y)<14)stack++;});
      return stack;
    });
    const scatterPoints=positioned.map(({s,x,y},i)=>{
      const good=s.cumplPct>=50&&s.avanceAcumPct>=50;
      const bad=s.cumplPct<50&&s.avanceAcumPct<50;
      const color=good?"#10b981":bad?"#ef4444":"#f59e0b";
      const label=(s.user.name||"").split(" ")[0];
      const r=8+(s.totalItems/maxItems)*16;
      const ly=y-r-4-(labelOffsets[i]*13);
      return `<g>
        <circle cx="${x}" cy="${y}" r="${r}" fill="${color}" fill-opacity="0.55" stroke="${color}" stroke-width="1.5"/>
        <text x="${x}" y="${ly}" font-size="11" text-anchor="middle" fill="var(--ink)" font-weight="600">${esc(label)}</text>
      </g>`;
    }).join("");
    const scatterSvg=`<svg viewBox="0 0 ${SW} ${SH}" style="width:100%;height:auto;max-height:340px">
      <rect x="${PAD}" y="${PAD}" width="${SW-2*PAD}" height="${SH-2*PAD}" fill="none"/>
      <rect x="${midX}" y="${PAD}" width="${SW-PAD-midX}" height="${midY-PAD}" fill="#ecfdf5"/>
      <rect x="${PAD}" y="${midY}" width="${midX-PAD}" height="${SH-PAD-midY}" fill="#fef2f2"/>
      <rect x="${midX}" y="${midY}" width="${SW-PAD-midX}" height="${SH-PAD-midY}" fill="#fffbeb"/>
      <rect x="${PAD}" y="${PAD}" width="${midX-PAD}" height="${midY-PAD}" fill="#fffbeb"/>
      <line x1="${PAD}" y1="${midY}" x2="${SW-PAD}" y2="${midY}" stroke="#cbd5e1" stroke-dasharray="3,3"/>
      <line x1="${midX}" y1="${PAD}" x2="${midX}" y2="${SH-PAD}" stroke="#cbd5e1" stroke-dasharray="3,3"/>
      <line x1="${PAD}" y1="${SH-PAD}" x2="${SW-PAD}" y2="${SH-PAD}" stroke="#94a3b8"/>
      <line x1="${PAD}" y1="${PAD}" x2="${PAD}" y2="${SH-PAD}" stroke="#94a3b8"/>
      <text x="${SW/2}" y="${SH-8}" font-size="11" text-anchor="middle" fill="var(--muted)">Cumplimiento %</text>
      <text x="14" y="${SH/2}" font-size="11" text-anchor="middle" fill="var(--muted)" transform="rotate(-90 14 ${SH/2})">Avance acumulado %</text>
      <text x="${PAD+4}" y="${PAD+14}" font-size="10" fill="var(--muted)">100%</text>
      <text x="${PAD+4}" y="${SH-PAD-6}" font-size="10" fill="var(--muted)">0%</text>
      <text x="${SW-PAD-4}" y="${SH-PAD-6}" font-size="10" fill="var(--muted)" text-anchor="end">100%</text>
      ${scatterPoints}
    </svg>`;

    // Panel 3: donuts individuales por persona
    const donut=(s)=>{
      const total=s.totalItems||1;
      const done=s.doneItems,pend=s.totalItems-s.doneItems-s.extras<0?0:s.totalItems-s.doneItems-s.extras,extra=s.extras;
      const r=32,cx=40,cy=40,circ=2*Math.PI*r;
      let offset=0;
      const seg=(val,color)=>{
        const frac=s.totalItems?val/s.totalItems:0;
        const len=frac*circ;
        const dash=`${len} ${circ-len}`;
        const dashoffset=circ-offset;
        offset+=len;
        return frac>0?`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="11" stroke-dasharray="${dash}" stroke-dashoffset="${dashoffset}" transform="rotate(-90 ${cx} ${cy})"/>`:"";
      };
      const svg=s.totalItems
        ?`<svg viewBox="0 0 80 80" style="width:74px;height:74px">
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="11"/>
            ${seg(done,"#10b981")}${seg(pend,"#ef4444")}${seg(extra,"#f59e0b")}
            <text x="${cx}" y="${cy+4}" font-size="14" text-anchor="middle" font-weight="700" fill="var(--ink)">${s.totalItems}</text>
          </svg>`
        :`<svg viewBox="0 0 80 80" style="width:74px;height:74px">
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="11"/>
            <text x="${cx}" y="${cy+4}" font-size="11" text-anchor="middle" fill="var(--muted)">—</text>
          </svg>`;
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px">${svg}<span style="font-size:11px;text-align:center;max-width:80px;line-height:1.2">${esc((s.user.name||"").split(" ")[0])}</span></div>`;
    };

    html+=`<div class="grid g2" style="margin-bottom:14px">
      <div class="card"><div class="card-h">📊 Asistencia real vs esperada</div><div class="card-b">
        <div style="display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:10px"><span>▓ días registrados</span><span>▦ días hábiles del periodo</span></div>
        ${allStats.map(attendanceBar).join("")}
      </div></div>
      <div class="card"><div class="card-h">📊 Cumplimiento vs Avance Acumulado</div><div class="card-b">
        <div style="display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:8px"><span>🟢 ambos altos</span><span>🟡 mixto</span><span>🔴 ambos bajos</span><span style="margin-left:auto;color:var(--muted)">tamaño = nº de tarjetas</span></div>
        ${scatterSvg}
      </div></div>
    </div>
    <div class="grid g2">
      <div class="card"><div class="card-h">📊 Tarjetas por persona (30 días)</div><div class="card-b">
        <div style="display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:10px"><span>🟢 Hechas</span><span>🔴 Pendientes</span><span>🟡 Extras</span></div>
        <div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:space-around">
          ${allStats.map(donut).join("")}
        </div>
      </div></div>
      <div class="card"><div class="card-h">📊 Ranking de rendimiento global</div><div class="card-b">
        <table><thead><tr><th>#</th><th>Persona</th><th>Asist.</th><th>Cumpl.</th><th>Horas</th><th>Avance</th><th>Extras</th><th>Puntaje</th></tr></thead><tbody>
        ${allStats.map(s=>{const factors=[s.asistPct,s.cumplPct,s.hoursPct,s.avanceAcumPct];if(s.extrasPct!==null)factors.push(s.extrasPct);const score=Math.round(factors.reduce((a,b)=>a+b,0)/factors.length);return {...s,score};}).sort((a,b)=>b.score-a.score).map((s,i)=>{
          const medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":"";
          return `<tr><td>${medal||i+1}</td><td><b>${esc(s.user.name)}</b></td>
            <td class="num" style="color:${barColor(s.asistPct)}">${s.asistPct}%</td>
            <td class="num" style="color:${barColor(s.cumplPct)}">${s.cumplPct}%</td>
            <td class="num" style="color:${barColor(s.hoursPct)}">${s.hoursPct}%</td>
            <td class="num" style="color:${barColor(s.avanceAcumPct)}">${s.avanceAcumPct}%</td>
            <td class="num" style="color:${s.extrasPct===null?"var(--muted)":barColor(s.extrasPct)}">${s.extrasPct===null?"—":s.extrasPct+"%"}</td>
            <td class="num" style="font-weight:700;color:${barColor(s.score)}">${s.score}%</td></tr>`;
        }).join("")}
        </tbody></table>
      </div></div>
    </div>`;
  }
  return html;
}

/* ============ EQUIPO ============ */
function viewEquipo(){
  const groups=[["jefe","Jefatura"],["supervisor","Supervisores"],["colaborador","Colaboradores"]];
  let html=ph("Gestión de Equipo","Asigna roles y aprueba nuevos miembros.");
  const pending=data.users.filter(u=>u.status==="pendiente");
  const rejected=data.users.filter(u=>u.status==="rechazado");
  if(pending.length){
    html+=`<div class="card" style="margin-bottom:14px;border-color:var(--amber)">
      <div class="card-h" style="background:#fffbeb">⏳ Pendientes de aprobación (${pending.length})</div>
      <div>${pending.map(u=>`<div style="display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap">
        <div class="avatar" style="background:#92400e">${initials(u.name)}</div>
        <div style="flex:1;min-width:140px"><div style="font-weight:500">${esc(u.name)}</div><div style="font-size:12px;color:var(--muted)">${esc(u.email||"")}</div></div>
        <div style="display:flex;gap:6px;align-items:center">
          <select id="role-sel-${u.id}" style="width:auto;padding:5px 8px;font-size:12px"><option value="colaborador">Colaborador</option><option value="supervisor">Supervisor</option><option value="jefe">Jefe</option></select>
          <button class="btn primary sm" onclick="aprobarConRol('${u.id}')">✅ Aprobar</button>
          <button class="btn line sm" style="color:var(--red)" onclick="rechazarUsuario('${u.id}')">🚫 Rechazar</button>
        </div>
      </div>`).join("")}</div>
    </div>`;
  }
  groups.forEach(([r,title])=>{
    const list=data.users.filter(u=>u.role===r&&u.status!=="pendiente"&&u.status!=="rechazado");
    html+=`<div class="card" style="margin-bottom:14px"><div class="card-h">${title} (${list.length})</div>
      <div>${list.map(u=>`<div style="display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap">
        <div class="avatar" style="background:var(--ink2)">${initials(u.name)}</div>
        <div style="flex:1;min-width:140px"><div style="font-weight:500">${esc(u.name)} ${u.id===state.user.uid?'<span style="color:var(--accent);font-size:12px">(tú)</span>':""}</div><div style="font-size:12px;color:var(--muted)">${esc(u.email||"")}</div></div>
        <select onchange="setRole('${u.id}',this.value)" style="width:auto;padding:5px 8px;font-size:12px"><option value="colaborador" ${u.role==="colaborador"?"selected":""}>Colaborador</option><option value="supervisor" ${u.role==="supervisor"?"selected":""}>Supervisor</option><option value="jefe" ${u.role==="jefe"?"selected":""}>Jefe</option></select>
      </div>`).join("")||`<div class="card-b" style="color:var(--muted);font-size:13px">Sin miembros.</div>`}</div></div>`;
  });
  if(rejected.length){
    html+=`<div class="card" style="margin-bottom:14px;border-color:var(--red)">
      <div class="card-h" style="background:#fef2f2">🚫 Accesos rechazados (${rejected.length})</div>
      <div>${rejected.map(u=>`<div style="display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap">
        <div class="avatar" style="background:#b91c1c">${initials(u.name)}</div>
        <div style="flex:1;min-width:140px"><div style="font-weight:500">${esc(u.name)}</div><div style="font-size:12px;color:var(--muted)">${esc(u.email||"")}</div></div>
        <button class="btn line sm" onclick="aprobarConRol('${u.id}')">Aprobar de todas formas</button>
      </div>`).join("")}</div>
    </div>`;
  }
  return html;
}
async function aprobarConRol(uid){
  const selEl=document.getElementById("role-sel-"+uid);
  const role=selEl?selEl.value:"colaborador";
  await fb.fs.collection("users").doc(uid).update({status:"aprobado",role});
  const u=uById(uid);addLog(`Aprobó acceso de ${u?.name||uid} como ${ROLE_LABEL[role]}`);
}

/* ============ BITÁCORA ============ */
function viewBitacora(){
  let html=ph("Bitácora","Registro de todos los movimientos del sistema.");
