</script>
<script>
/* ============ MODAL DE TAREA (frente de expediente) ============ */
function openTask(tid){
  const t=data.tasks.find(x=>x.id===tid);if(!t)return;
  const p=pById(t.projectId)||{};
  const esp=elapsedPct(p);
  const subs=t.subItems||[];
  const hasSubs=subs.length>0;
  const canEdit=state.profile.role==="jefe"||(!hasSubs&&t.assigneeId===state.user.uid)||
    (hasSubs&&subs.some(s=>s.assigneeId===state.user.uid));
  const canComment=state.profile.role==="jefe"||state.profile.role==="supervisor"||
    t.assigneeId===state.user.uid||(hasSubs&&subs.some(s=>s.assigneeId===state.user.uid));
  const isJefe=state.profile.role==="jefe";
  const todayI=todayISO();
  const userOpts=`<option value="">— sin asignar —</option>${data.users.filter(u=>u.role!=="supervisor"&&u.status!=="pendiente").map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}`;

  // Avance global: promedio de subs si tiene, o el pctReal directo
  const globalPct=hasSubs&&subs.length
    ?Math.round(subs.reduce((a,s)=>a+(s.pctReal||0),0)/subs.length)
    :(t.pctReal||0);
  const st=STATUS[statusFor(globalPct,esp)];

  // Sub-incisos HTML
  let subsHtml="";
  if(hasSubs){
    const subRows=subs.map((s,i)=>{
      const isMyS=s.assigneeId===state.user.uid;
      const canEditS=isJefe||isMyS;
      const alreadyBoard=data.boardItems.find(b=>b.subItemId===`${tid}_${i}`&&b.userId===state.user.uid&&b.date===todayI&&b.col!=="done");
      const doneBoard=data.boardItems.find(b=>b.subItemId===`${tid}_${i}`&&b.userId===state.user.uid&&b.date===todayI&&b.col==="done");
      const pctColor=(s.pctReal||0)>=80?"var(--green)":(s.pctReal||0)>=40?"var(--amber)":"var(--muted)";
      return `<div style="padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-size:13px;font-weight:500;flex:1">${esc(s.name)}</span>
          <span style="font-family:var(--mono);font-size:12px;font-weight:700;color:${pctColor}">${s.pctReal||0}%</span>
        </div>
        <div class="devbar" style="height:5px;margin:5px 0 8px"><div class="fill" style="width:${s.pctReal||0}%;background:${pctColor}"></div></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          ${isJefe?`<select id="sub-user-${i}" onchange="updateSubAssignee('${tid}',${i},this.value)" style="font-size:12px;padding:3px 6px;flex:1;min-width:120px">${userOpts.replace(`value="${s.assigneeId||""}"`,`value="${s.assigneeId||""}" selected`)}</select>`
            :`<span style="font-size:12px;color:var(--muted)">👤 ${s.assigneeId?esc(s.assigneeName||""):"sin asignar"}</span>`}
          ${canEditS?`<input type="range" id="sub-pct-${i}" min="0" max="100" step="5" value="${s.pctReal||0}" oninput="document.getElementById('sub-lbl-${i}').textContent=this.value+'%'" style="width:100px;accent-color:var(--accent)"/><span id="sub-lbl-${i}" style="font-family:var(--mono);font-size:11px;min-width:32px">${s.pctReal||0}%</span>`:""}
          ${(isMyS||doneBoard)?
            doneBoard?`<span style="font-size:11px;color:var(--green);font-weight:500">✅ Completado hoy</span>`:
            alreadyBoard?`<span style="font-size:11px;color:var(--accent);font-weight:500">🔨 En pizarra</span>`:
            `<button class="btn line sm" onclick="activarSubItemHoy('${tid}',${i})">Activar hoy →</button>`:""}
        </div>
      </div>`;
    }).join("");
    subsHtml=`<div style="margin-top:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <b style="font-size:12px;color:var(--muted);text-transform:uppercase">Sub-incisos (${subs.length})</b>
        ${isJefe?`<button class="btn line sm" onclick="addSubItem('${tid}')">+ Agregar sub-inciso</button>`:""}
      </div>
      ${subRows}
      ${isJefe?`<button class="btn primary sm" onclick="saveSubItems('${tid}')" style="margin-top:6px">Guardar cambios</button>`:""}
    </div>`;
  }

  // Si no tiene subs: slider de avance + opción de cargar sub-incisos desde plantilla
  const tplCap=p.template?TEMPLATES[p.template]?.chapters.find(c=>c.id===t.capId):null;
  const hasTplSubs=tplCap?.subs?.length>0;
  const noSubsEdit=!hasSubs&&(isJefe||t.assigneeId===state.user.uid)?`<div style="margin-top:14px">
    <label class="t" style="display:block;font-size:12px;margin-bottom:4px">Avance del capítulo</label>
    <input type="range" id="mtask-pct" min="0" max="100" step="5" value="${t.pctReal||0}" oninput="document.getElementById('mtask-lbl').textContent=this.value+'%'"/>
    <div style="text-align:right;font-family:var(--mono);font-weight:600" id="mtask-lbl">${t.pctReal||0}%</div>
    ${!hasSubs&&!isJefe?`<div style="margin-top:8px">
      ${data.boardItems.find(b=>b.taskId===tid&&b.userId===state.user.uid&&b.date===todayI&&b.col!=="done")
        ?`<span style="font-size:12px;color:var(--accent)">🔨 Ya en pizarra de hoy</span>`
        :`<button class="btn dark sm" onclick="activarFrenteHoy('${tid}')">📋 Activar en mi pizarra de hoy</button>`}
    </div>`:""}
    ${isJefe&&hasTplSubs?`<div style="margin-top:10px;padding:8px;background:#fffbeb;border-radius:6px;font-size:12px">
      📋 Este capítulo tiene <b>${tplCap.subs.length} sub-incisos</b> en la plantilla (${tplCap.subs.slice(0,2).map(s=>esc(s)).join(", ")}...).
      <button class="btn line sm" onclick="cargarSubItemsDePlantilla('${tid}')" style="margin-top:6px;display:block">Cargar sub-incisos de la plantilla</button>
    </div>`:""}
  </div>`:"";


  document.getElementById("modal").innerHTML=`<div class="modal"><div class="modal-c" style="max-width:620px">
    <div class="modal-h"><h3>${esc(t.specialty)}</h3><span class="codetag">${esc(p.code||"")}</span><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <p style="margin:0 0 8px;color:var(--muted);font-size:13px">${esc(p.name||"")}</p>
      <div class="devbar"><div class="fill" style="width:${globalPct}%;background:${st.hex}"></div><div class="tick" style="left:${Math.min(esp,100)}%"></div></div>
      <div class="devsub"><span>real ${globalPct}% ${hasSubs?"(promedio subs)":""}</span><span>esp. ${esp}%</span></div>
      ${hasSubs?"":noSubsEdit}
      ${subsHtml}
      <label class="fl" style="margin-top:10px"><span class="t">🔗 Enlace al trabajo</span>
        <input id="mtask-link" value="${esc(t.link||"")}" placeholder="Pega el link aquí..." ${!canEdit?"readonly":""}/></label>
      ${p.driveLink?`<div style="font-size:12px;color:var(--accent);margin-top:-6px;margin-bottom:10px">📁 <a href="${esc(p.driveLink)}" target="_blank">Abrir Drive del expediente</a></div>`:""}
      <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
        <b style="font-size:12px;color:var(--muted);text-transform:uppercase">Comentarios y observaciones</b>
        <div style="margin-top:6px">${commentThread(cFor(t.id))}</div>
        ${canComment?`<div style="display:flex;gap:8px;margin-top:8px"><input id="mtask-comment" placeholder="${state.profile.role==="colaborador"?"¿Algún bloqueo o avance?":"Deja tu observación..."}"/><button class="btn dark sm" onclick="sendTaskComment('${tid}')">Enviar</button></div>`:""}
      </div>
    </div>
    <div class="modal-f">
      ${!hasSubs&&canEdit?`<button class="btn primary" onclick="saveTaskModal('${tid}')">Guardar</button>`:""}
      ${isJefe?`<button class="btn line" onclick="deleteTask('${tid}')">Eliminar</button>`:""}
      <button class="btn line" onclick="closeModal()">Cerrar</button>
    </div>
  </div></div>`;
}
async function saveSubItems(tid){
  const t=data.tasks.find(x=>x.id===tid);if(!t)return;
  const subs=(t.subItems||[]).map((s,i)=>{
    const pctEl=document.getElementById(`sub-pct-${i}`);
    const userEl=document.getElementById(`sub-user-${i}`);
    const pct=pctEl?Number(pctEl.value)||0:s.pctReal||0;
    const assigneeId=userEl?userEl.value||null:s.assigneeId||null;
    const u=assigneeId?uById(assigneeId):null;
    return {...s,pctReal:pct,assigneeId,assigneeName:u?.name||""};
  });
  const globalPct=subs.length?Math.round(subs.reduce((a,s)=>a+(s.pctReal||0),0)/subs.length):0;
  try{
    await fb.fs.collection("tasks").doc(tid).update({subItems:subs,pctReal:globalPct,updatedAt:new Date().toISOString(),updatedBy:state.profile.name});
    const p=pById(t.projectId)||{};
    addLog(`Actualizó sub-incisos de ${t.specialty} (${p.code||""}) → ${globalPct}%`);
    openTask(tid);
  }catch(e){alert("Error: "+e.message);}
}
async function updateSubAssignee(tid,idx,assigneeId){
  const t=data.tasks.find(x=>x.id===tid);if(!t)return;
  const subs=[...(t.subItems||[])];
  const u=assigneeId?uById(assigneeId):null;
  subs[idx]={...subs[idx],assigneeId:assigneeId||null,assigneeName:u?.name||""};
  try{await fb.fs.collection("tasks").doc(tid).update({subItems:subs,updatedAt:new Date().toISOString(),updatedBy:state.profile.name});}
  catch(e){console.error(e);}
}
async function addSubItem(tid){
  const name=prompt("Nombre del sub-inciso:");
  if(!name)return;
  const t=data.tasks.find(x=>x.id===tid);if(!t)return;
  const subs=[...(t.subItems||[]),{id:`${t.capId}_s${Date.now()}`,name,pctReal:0,assigneeId:null,assigneeName:""}];
  try{
    await fb.fs.collection("tasks").doc(tid).update({subItems:subs,updatedAt:new Date().toISOString(),updatedBy:state.profile.name});
    openTask(tid);
  }catch(e){alert("Error: "+e.message);}
}
async function activarSubItemHoy(tid,subIdx){
  const t=data.tasks.find(x=>x.id===tid);if(!t)return;
  const p=pById(t.projectId)||{};
  const sub=(t.subItems||[])[subIdx];if(!sub)return;
  const todayI=todayISO();
  const subItemId=`${tid}_${subIdx}`;
  const already=data.boardItems.find(b=>b.subItemId===subItemId&&b.userId===state.user.uid&&b.date===todayI&&b.col!=="done");
  if(already){closeModal();return;}
  try{
    await fb.fs.collection("board_items").add({
      userId:state.user.uid,userName:state.profile.name,date:todayI,
      text:`${sub.name} — ${t.specialty}${p.code?` (${p.code})`:""}`,
      projectId:t.projectId||null,taskId:tid,subItemId,
      tag:"plan",pct:sub.pctReal||0,link:"",col:"doing",
      createdBy:state.profile.name,createdAt:new Date().toISOString()
    });
    addLog(`Activó sub-inciso en pizarra: ${sub.name}`);
    closeModal();
  }catch(e){alert("Error: "+e.message);}
}
async function cargarSubItemsDePlantilla(tid){
  const t=data.tasks.find(x=>x.id===tid);if(!t)return;
  const p=pById(t.projectId)||{};
  const tpl=p.template?TEMPLATES[p.template]:null;
  const cap=tpl?.chapters.find(c=>c.id===t.capId);
  if(!cap?.subs?.length)return alert("Este capítulo no tiene sub-incisos en la plantilla.");
  if(!confirm(`¿Cargar ${cap.subs.length} sub-incisos de la plantilla "${cap.name}"? Los sub-incisos no tendrán responsable asignado por ahora.`))return;
  const subItems=cap.subs.map((s,i)=>({id:`${t.capId}_s${i}`,name:s,pctReal:0,assigneeId:null,assigneeName:""}));
  try{
    await fb.fs.collection("tasks").doc(tid).update({subItems,updatedAt:new Date().toISOString(),updatedBy:state.profile.name});
    addLog(`Cargó sub-incisos de plantilla en ${t.specialty} (${p.code})`);
    openTask(tid);
  }catch(e){alert("Error: "+e.message);}
}
async function activarFrenteHoy(tid){
  const t=data.tasks.find(x=>x.id===tid);if(!t)return;
  const p=pById(t.projectId)||{};
  const todayI=todayISO();
  const already=data.boardItems.find(b=>b.taskId===tid&&b.userId===state.user.uid&&b.date===todayI&&b.col!=="done");
  if(already)return;
  try{
    await fb.fs.collection("board_items").add({
      userId:state.user.uid,userName:state.profile.name,date:todayI,
      text:`${t.specialty}${p.code?` (${p.code})`:""}`,
      projectId:t.projectId||null,taskId:tid,tag:"plan",
      pct:t.pctReal||0,link:t.link||"",col:"doing",
      createdBy:state.profile.name,createdAt:new Date().toISOString()
    });
    addLog(`Activó en pizarra: ${t.specialty} (${p.code||""})`);
  }catch(e){alert("Error: "+e.message);}
}
async function registerTaskInBoard(tid){
  const t=data.tasks.find(x=>x.id===tid);if(!t)return;
  const p=pById(t.projectId)||{};
  const todayI=todayISO();
  try{
    const ref=await fb.fs.collection("board_items").add({
      userId:state.user.uid,userName:state.profile.name,date:todayI,
      text:`${t.specialty}${p.code?` (${p.code})`:""}`,
      projectId:t.projectId||null,taskId:tid,tag:"plan",pct:t.pctReal||0,link:t.link||"",col:"doing",
      createdBy:state.profile.name,createdAt:new Date().toISOString()
    });
    addLog(`Registró en pizarra: ${t.specialty} (${p.code||""})`);
    openBoardItem(ref.id,state.user.uid,todayI);
  }catch(e){alert("Error: "+e.message);}
}
async function saveTaskModal(tid){
  const t=data.tasks.find(x=>x.id===tid);if(!t)return;
  const pct=Number(document.getElementById("mtask-pct")?.value||t.pctReal||0);
  const link=document.getElementById("mtask-link")?.value.trim()||"";
  try{await fb.fs.collection("tasks").doc(tid).update({pctReal:pct,link,updatedAt:new Date().toISOString(),updatedBy:state.profile.name});addLog(`Actualizó ${t.specialty} (${pById(t.projectId)?.code||""}) a ${pct}%`);closeModal();}catch(e){alert("Error: "+e.message);}
}
async function sendTaskComment(tid){
  const v=val("mtask-comment");if(!v)return;
  await addComment(tid,v,state.profile.role==="colaborador"?"justificacion":"feedback");
  openTask(tid);
}
async function deleteTask(tid){
  if(!confirm("¿Eliminar este frente de trabajo?"))return;
  try{await fb.fs.collection("tasks").doc(tid).delete();addLog(`Eliminó un frente de trabajo`);closeModal();}catch(e){alert("Error: "+e.message);}
}

/* ============ CREAR EXPEDIENTE ============ */
function openNewProject(){
  document.getElementById("modal").innerHTML=`<div class="modal"><div class="modal-c">
    <div class="modal-h"><h3>Nuevo expediente</h3><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <label class="fl"><span class="t">1️⃣ Tipo</span>
        <select id="np-mode" onchange="updateNpForm()">
          <option value="curso">📂 Expediente nuestro (en curso / nuevo)</option>
          <option value="observacion">🔄 Observaciones de un expediente</option>
        </select>
      </label>

      <div id="np-curso-section">
        <label class="fl"><span class="t">2️⃣ Plantilla del expediente</span>
          <div class="tplsel">
            ${Object.entries(TEMPLATES).map(([k,t])=>`<div class="tplopt" data-tpl="${k}" onclick="selectTpl('${k}')"><b>${t.icon} ${t.name}</b><small>${t.desc}</small></div>`).join("")}
          </div>
        </label>
        <div id="np-tpl-preview"></div>
      </div>

      <div id="np-obs-section" style="display:none">
        <label class="fl"><span class="t">2️⃣ ¿Este expediente ya existe en el sistema?</span>
          <select id="np-obs-exists" onchange="updateObsForm()">
            <option value="no">No, es externo / no lo manejamos</option>
            <option value="si">Sí, es uno de los nuestros</option>
          </select>
        </label>
        <div id="np-obs-base" style="display:none">
          <label class="fl"><span class="t">Plantilla del expediente observado</span>
            <select id="np-obs-tpl" onchange="selectObsTpl()">
              <option value="">— elegir —</option>
              ${Object.entries(TEMPLATES).map(([k,t])=>`<option value="${k}">${t.icon} ${t.name}</option>`).join("")}
            </select>
          </label>
          <label class="fl"><span class="t">Expediente relacionado (opcional, para trazabilidad)</span>
            <select id="np-obs-related">
              <option value="">— ninguno —</option>
              ${data.projects.map(p=>`<option value="${p.id}">${esc(p.code)} · ${esc(p.name)}</option>`).join("")}
            </select>
          </label>
          <div id="np-obs-caps"></div>
        </div>
      </div>

      <div class="grid g2" style="margin-top:8px">
        <label class="fl"><span class="t">Código</span><input id="np-code" placeholder="ET-04 / OBS-01"/></label>
        <label class="fl"><span class="t">Nombre</span><input id="np-name" placeholder="Mejoramiento de..."/></label>
        <label class="fl"><span class="t">Ubicación</span><input id="np-loc"/></label>
        <label class="fl"><span class="t">Estado</span><select id="np-status">
          <option value="activo">🟢 Activo</option>
          <option value="paralizado">⏸️ Paralizado</option>
          <option value="observacion" selected>🔄 En observaciones</option>
        </select></label>
        <label class="fl"><span class="t">Fecha real de inicio</span><input type="date" id="np-start"/></label>
        <label class="fl"><span class="t">Fecha límite</span><input type="date" id="np-end"/></label>
      </div>
      <label class="fl"><span class="t">📁 Link de Drive del expediente (opcional)</span><input id="np-drive" placeholder="https://drive.google.com/..."/></label>
      <div id="np-caps-section" style="display:none"></div>
    </div>
    <div class="modal-f">
      <button class="btn primary" onclick="saveNewProject()">Crear expediente</button>
      <button class="btn line" onclick="closeModal()">Cancelar</button>
    </div>
  </div></div>`;
  state._selTpl=null;state._obsTpl=null;
  updateNpForm();
}
function updateNpForm(){
  const mode=document.getElementById("np-mode").value;
  document.getElementById("np-curso-section").style.display=mode==="curso"?"block":"none";
  document.getElementById("np-obs-section").style.display=mode==="observacion"?"block":"none";
  document.getElementById("np-caps-section").style.display="none";
  document.getElementById("np-caps-section").innerHTML="";
  const obsCaps=document.getElementById("np-obs-caps");if(obsCaps)obsCaps.innerHTML="";
  if(mode==="curso")document.getElementById("np-status").value="activo";
  else document.getElementById("np-status").value="observacion";
}
function updateObsForm(){
  const exists=document.getElementById("np-obs-exists").value;
  document.getElementById("np-obs-base").style.display=exists==="si"?"block":"none";
  document.getElementById("np-caps-section").style.display="none";
  document.getElementById("np-caps-section").innerHTML="";
  const obsCaps=document.getElementById("np-obs-caps");if(obsCaps)obsCaps.innerHTML="";
  if(exists==="no"){
    document.getElementById("np-caps-section").style.display="block";
    document.getElementById("np-caps-section").innerHTML=`<div style="margin-top:6px;border-top:1px solid var(--line);padding-top:12px">
      <b style="font-size:12px;text-transform:uppercase;color:var(--muted)">3️⃣ Frentes observados (escribe manualmente)</b>
      <div id="obs-manual-list" style="margin-top:8px"></div>
      <button class="btn line sm" onclick="addManualObsCap()" style="margin-top:6px">+ Agregar frente</button>
    </div>`;
    addManualObsCap();
  }
}
function addManualObsCap(){
  const userOpts=`<option value="">— sin asignar —</option>${data.users.filter(u=>u.role!=="supervisor").map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}`;
  const list=document.getElementById("obs-manual-list");
  const idx=list.children.length;
  const row=document.createElement("div");
  row.className="cap-row";
  row.innerHTML=`<input class="cap-name" placeholder="Nombre del frente observado" style="flex:1;min-width:140px" data-manual="${idx}"/>
    <select data-manual-user="${idx}">${userOpts}</select>
    <button class="iconbtn" onclick="this.parentElement.remove()">${ICONS.trash}</button>`;
  list.appendChild(row);
}
function selectTpl(k){
  state._selTpl=k;
  document.querySelectorAll(".tplopt").forEach(el=>el.classList.toggle("sel",el.dataset.tpl===k));
  const t=TEMPLATES[k];
  document.getElementById("np-tpl-preview").innerHTML=`<div class="tplbox">
    <b>Estructura completa:</b><ul>${t.chapters.map(c=>`<li>${esc(c.name)}${c.subs?` <span style="color:var(--muted)">(${c.subs.length} sub)</span>`:""}</li>`).join("")}</ul>
    <i>Se generan los capítulos principales como frentes de trabajo. Los sub-incisos los agregas después.</i>
  </div>`;
  renderCapForm(t);
}
function renderCapForm(t){
  const userOpts=`<option value="">— sin asignar —</option>${data.users.filter(u=>u.role!=="supervisor").map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}`;
  document.getElementById("np-caps-section").style.display="block";
  document.getElementById("np-caps-section").innerHTML=`<div style="margin-top:6px;border-top:1px solid var(--line);padding-top:12px">
    <b style="font-size:12px;text-transform:uppercase;color:var(--muted)">3️⃣ Avance actual de cada capítulo:</b>
    <div style="margin-top:8px">
      ${t.chapters.map((c,i)=>`<div class="cap-row">
        <span class="cap-name">${esc(c.name)}</span>
        <input type="number" min="0" max="100" value="0" id="cap-pct-${i}"/>
        <span style="font-size:11px;color:var(--muted)">%</span>
        <select id="cap-user-${i}">${userOpts}</select>
      </div>`).join("")}
    </div>
    <p style="font-size:11px;color:var(--muted);margin:10px 0 0">💡 Pon 100% a los capítulos ya completos/aprobados.</p>
  </div>`;
}
function selectObsTpl(){
  const k=document.getElementById("np-obs-tpl").value;
  state._obsTpl=k;
  const capsDiv=document.getElementById("np-obs-caps");
  if(!k){capsDiv.innerHTML="";return;}
  const t=TEMPLATES[k];
  const userOpts=`<option value="">— sin asignar —</option>${data.users.filter(u=>u.role!=="supervisor").map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}`;
  capsDiv.innerHTML=`<div style="margin-top:6px;border-top:1px solid var(--line);padding-top:12px">
    <b style="font-size:12px;text-transform:uppercase;color:var(--muted)">3️⃣ Marca qué capítulos vienen observados</b>
    <div style="margin-top:8px">
      ${t.chapters.map((c,i)=>`<div class="obscheck">
        <input type="checkbox" id="obscap-${i}"/>
        <label for="obscap-${i}" style="flex:1">${esc(c.name)}</label>
        <select id="obscap-user-${i}" style="width:auto;min-width:140px;padding:4px 6px;font-size:12px">${userOpts}</select>
      </div>`).join("")}
    </div>
    <p style="font-size:11px;color:var(--muted);margin-top:8px">💡 Marca solo los capítulos que vienen con observaciones. El resto no se creará.</p>
  </div>`;
}
async function saveNewProject(){
  const mode=document.getElementById("np-mode").value;
  const code=val("np-code"),name=val("np-name");
  if(!code||!name)return alert("Código y nombre son obligatorios.");
  const status=document.getElementById("np-status").value;
  const payload={code,name,location:val("np-loc"),startDate:val("np-start"),endDate:val("np-end"),driveLink:val("np-drive"),status,createdAt:new Date().toISOString(),createdBy:state.profile.name};
  if(status==="paralizado"){const r=prompt("¿Motivo de la pausa?","");payload.pauseReason=r||"";}

  if(mode==="curso"){
    if(!state._selTpl)return alert("Elige una plantilla.");
    payload.template=state._selTpl;
    try{
      const ref=await fb.fs.collection("projects").add(payload);
      addLog(`Creó expediente ${code} - ${name}`);
      const t=TEMPLATES[state._selTpl];
      for(let i=0;i<t.chapters.length;i++){
        const cap=t.chapters[i];
        const pct=valNum(`cap-pct-${i}`);
        const userId=document.getElementById(`cap-user-${i}`).value||null;
        const u=userId?uById(userId):null;
        const subItems=(cap.subs||[]).map((s,si)=>({id:`${cap.id}_s${si}`,name:s,pctReal:0,assigneeId:null,assigneeName:""}));
        await fb.fs.collection("tasks").add({projectId:ref.id,specialty:cap.name,capId:cap.id,assigneeId:userId,assigneeName:u?.name||"",pctReal:pct,subItems,entregables:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),updatedBy:state.profile.name});
      }
      closeModal();
    }catch(e){alert("Error: "+e.message);}
    return;
  }

  const exists=document.getElementById("np-obs-exists").value;
  if(exists==="si"){
    const tplKey=state._obsTpl;
    if(!tplKey)return alert("Elige la plantilla del expediente observado.");
    const t=TEMPLATES[tplKey];
    payload.template=tplKey;
    const relatedId=document.getElementById("np-obs-related").value;
    if(relatedId)payload.relatedProject=relatedId;
    const selected=[];
    t.chapters.forEach((c,i)=>{const ck=document.getElementById(`obscap-${i}`);if(ck&&ck.checked){const userId=document.getElementById(`obscap-user-${i}`).value||null;selected.push({cap:c,userId});}});
    if(!selected.length)return alert("Marca al menos un capítulo observado.");
    try{
      const ref=await fb.fs.collection("projects").add(payload);
      addLog(`Creó expediente de observaciones ${code} (plantilla ${t.name})`);
      for(const {cap,userId} of selected){
        const u=userId?uById(userId):null;
        const subItems=(cap.subs||[]).map((s,si)=>({id:`${cap.id}_s${si}`,name:s,pctReal:0,assigneeId:null,assigneeName:""}));
        await fb.fs.collection("tasks").add({projectId:ref.id,specialty:cap.name+" (OBS)",capId:cap.id,assigneeId:userId,assigneeName:u?.name||"",pctReal:0,subItems,entregables:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),updatedBy:state.profile.name});
      }
      closeModal();
    }catch(e){alert("Error: "+e.message);}
    return;
  }else{
    const list=document.getElementById("obs-manual-list");
    const rows=[...list.querySelectorAll(".cap-row")];
    const items=rows.map(r=>{
      const name=r.querySelector("[data-manual]").value.trim();
      const userSel=r.querySelector("[data-manual-user]");
      return {name,userId:userSel?userSel.value:""};
    }).filter(x=>x.name);
    if(!items.length)return alert("Agrega al menos un frente observado.");
    payload.template=null;
    try{
      const ref=await fb.fs.collection("projects").add(payload);
      addLog(`Creó expediente externo de observaciones ${code} - ${name}`);
      for(const it of items){
        const u=it.userId?uById(it.userId):null;
        await fb.fs.collection("tasks").add({projectId:ref.id,specialty:it.name+" (OBS)",assigneeId:it.userId||null,assigneeName:u?.name||"",pctReal:0,entregables:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),updatedBy:state.profile.name});
      }
      closeModal();
    }catch(e){alert("Error: "+e.message);}
  }
}

/* ============ EDITAR EXPEDIENTE ============ */
function openEditProject(pid){
  const p=pById(pid);if(!p)return;
  document.getElementById("modal").innerHTML=`<div class="modal"><div class="modal-c">
    <div class="modal-h"><h3>Editar expediente</h3><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <div class="grid g2">
        <label class="fl"><span class="t">Código</span><input id="ep-code" value="${esc(p.code||"")}"/></label>
        <label class="fl"><span class="t">Nombre</span><input id="ep-name" value="${esc(p.name||"")}"/></label>
        <label class="fl"><span class="t">Ubicación</span><input id="ep-loc" value="${esc(p.location||"")}"/></label>
        <label class="fl"><span class="t">Estado</span><select id="ep-status">
          ${Object.entries(PROJ_STATUS).map(([k,v])=>`<option value="${k}" ${(p.status||"activo")===k?"selected":""}>${v.emoji} ${v.lbl}</option>`).join("")}
        </select></label>
        <label class="fl"><span class="t">Fecha inicio</span><input type="date" id="ep-start" value="${p.startDate||""}"/></label>
        <label class="fl"><span class="t">Fecha fin</span><input type="date" id="ep-end" value="${p.endDate||""}"/></label>
      </div>
      <label class="fl"><span class="t">Motivo de pausa (si está paralizado)</span><input id="ep-pause" value="${esc(p.pauseReason||"")}"/></label>
      <label class="fl"><span class="t">Avance declarado % (solo si está cerrado)</span><input type="number" min="0" max="100" id="ep-declared" value="${p.declaredPct||100}"/></label>
      <label class="fl"><span class="t">📁 Link de Drive</span><input id="ep-drive" value="${esc(p.driveLink||"")}"/></label>
    </div>
    <div class="modal-f">
      <button class="btn danger" onclick="deleteProject('${pid}')">Eliminar expediente</button>
      <button class="btn primary" onclick="saveEditProject('${pid}')">Guardar</button>
      <button class="btn line" onclick="closeModal()">Cerrar</button>
    </div>
  </div></div>`;
}
async function saveEditProject(pid){
  const payload={code:val("ep-code"),name:val("ep-name"),location:val("ep-loc"),status:document.getElementById("ep-status").value,startDate:val("ep-start"),endDate:val("ep-end"),pauseReason:val("ep-pause"),declaredPct:valNum("ep-declared"),driveLink:val("ep-drive"),updatedAt:new Date().toISOString()};
  try{await fb.fs.collection("projects").doc(pid).update(payload);addLog(`Editó expediente ${payload.code}`);closeModal();}catch(e){alert("Error: "+e.message);}
}
async function deleteProject(pid){
  if(!confirm("¿Eliminar este expediente y todos sus frentes? Esta acción no se puede deshacer."))return;
  try{
    const ts=data.tasks.filter(t=>t.projectId===pid);
    for(const t of ts)await fb.fs.collection("tasks").doc(t.id).delete();
    await fb.fs.collection("projects").doc(pid).delete();
    addLog(`Eliminó un expediente`);closeModal();
  }catch(e){alert("Error: "+e.message);}
}

/* ============ AGREGAR FRENTE ============ */
function openAddTask(pid){
  const p=pById(pid);if(!p)return;
  const tpl=p.template?TEMPLATES[p.template]:null;
  // Solo mostrar capítulos principales, NO sub-incisos
  const existingCapIds=new Set(data.tasks.filter(t=>t.projectId===pid).map(t=>t.capId));
  const capOpts=tpl?tpl.chapters
    .filter(c=>!existingCapIds.has(c.id))
    .map(c=>`<option value="${esc(c.id)}">${esc(c.name)}${c.subs?.length?` (${c.subs.length} sub-incisos)`:""}</option>`)
    .join(""):"";
  const userOpts=data.users.filter(u=>u.role!=="supervisor"&&u.status!=="pendiente").map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("");
  document.getElementById("modal").innerHTML=`<div class="modal"><div class="modal-c">
    <div class="modal-h"><h3>+ Agregar capítulo</h3><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <p style="color:var(--muted);font-size:13px;margin:0 0 12px">Expediente: <b>${esc(p.code)} · ${esc(p.name)}</b></p>
      <div class="alert warn" style="margin-bottom:12px;font-size:12px">💡 Los sub-incisos de cada capítulo se gestionan dentro del capítulo (botón "ver"). Este formulario agrega capítulos principales.</div>
      <label class="fl"><span class="t">Capítulo</span>
        ${capOpts?`<select id="at-cap-pick" onchange="atPickCap(this,'${pid}')"><option value="">— elegir de la plantilla —</option>${capOpts}</select><br><br>`:""}
        <input id="at-name" placeholder="Nombre del capítulo (si no está en la plantilla)"/>
      </label>
      <div class="grid g2">
        <label class="fl"><span class="t">Responsable principal</span><select id="at-user"><option value="">— sin asignar —</option>${userOpts}</select></label>
        <label class="fl"><span class="t">% inicial</span><input type="number" id="at-pct" min="0" max="100" value="0"/></label>
      </div>
      <div id="at-subs-preview" style="margin-top:8px;font-size:12px;color:var(--muted)"></div>
    </div>
    <div class="modal-f">
      <button class="btn primary" onclick="saveAddTask('${pid}')">Agregar capítulo</button>
      <button class="btn line" onclick="closeModal()">Cancelar</button>
    </div>
  </div></div>`;
}
function atPickCap(sel,pid){
  const p=pById(pid);const tpl=p?.template?TEMPLATES[p.template]:null;
  const cap=tpl?.chapters.find(c=>c.id===sel.value);
  const nameEl=document.getElementById("at-name");
  const preview=document.getElementById("at-subs-preview");
  if(cap){
    if(nameEl)nameEl.value=cap.name;
    if(preview&&cap.subs?.length)preview.innerHTML=`<b>Sub-incisos que se crearán dentro:</b><ul style="margin:4px 0 0 16px">${cap.subs.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`;
    else if(preview)preview.innerHTML="";
  }
}
async function saveAddTask(pid){
  const name=val("at-name");if(!name)return alert("Escribe el nombre del capítulo.");
  const userId=document.getElementById("at-user").value||null;
  const u=userId?uById(userId):null;
  const pct=valNum("at-pct");
  const p=pById(pid);
  const tpl=p?.template?TEMPLATES[p.template]:null;
  const capPickEl=document.getElementById("at-cap-pick");
  const capId=capPickEl?capPickEl.value:"";
  const cap=tpl?.chapters.find(c=>c.id===capId);
  const subItems=(cap?.subs?.map((s,i)=>({id:`${capId}_s${i}`,name:s,pctReal:0,assigneeId:null,assigneeName:""})))||[];
  try{
    await fb.fs.collection("tasks").add({
      projectId:pid,specialty:name,capId:capId||`manual_${Date.now()}`,
      assigneeId:userId,assigneeName:u?.name||"",
      pctReal:pct,subItems,entregables:[],
      createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),updatedBy:state.profile.name
    });
    addLog(`Agregó capítulo "${name}" a ${p?.code}`);
    closeModal();
  }catch(e){alert("Error: "+e.message);}
}

/* ============ EVENTOS GLOBALES ============ */
function bindEvents(){
  document.getElementById("app").addEventListener("click",e=>{
    const b=e.target.closest("[data-act]");if(!b)return;
    const act=b.dataset.act,id=b.dataset.id;
    if(act==="tab"){state.tab=id;render();}
    else if(act==="logout")doLogout();
    else if(act==="refresh")render();
    else if(act==="authmode"){state.authMode=id;renderLogin();}
    else if(act==="login")doLogin();
    else if(act==="register")doRegister();
    else if(act==="pfilter"){state.projFilter=id;render();}
    else if(act==="newproj")openNewProject();
    else if(act==="editproj")openEditProject(id);
    else if(act==="addtask")openAddTask(id);
    else if(act==="opentask")openTask(id);
    else if(act==="pztab"){state.pizarraSubtab=id;render();}
    else if(act==="dtab"){state.desempenoTab=id;render();}
  });
  document.getElementById("app").addEventListener("input",e=>{
    if(e.target.id==="psearch"){
      state.projSearch=e.target.value;
      clearTimeout(window._searchTimer);
      window._searchTimer=setTimeout(render,250);
    }
  });
}
</script>
