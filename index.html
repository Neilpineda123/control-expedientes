<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Control de Expedientes Técnicos</title>

<!-- Firebase (se carga solo desde el sitio publicado) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
  :root{
    --ink:#0f172a; --ink2:#1e293b; --paper:#f1f5f9; --card:#ffffff; --line:#e2e8f0;
    --text:#1e293b; --muted:#64748b; --accent:#2563eb; --accent-d:#1d4ed8;
    --green:#10b981; --amber:#f59e0b; --red:#ef4444;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--text);font-size:15px}
  .mono{font-family:var(--mono)}
  a{color:var(--accent);text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:0}

  /* Layout */
  .layout{display:flex;min-height:100vh}
  .sb{width:240px;flex:0 0 240px;background:var(--ink);color:#cbd5e1;display:flex;flex-direction:column}
  .sb-brand{padding:16px;border-bottom:1px solid #1e293b}
  .sb-tag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7dd3fc}
  .sb-title{margin-top:4px;color:#fff;font-weight:600;font-size:14px}
  .nav{display:flex;flex-direction:column;gap:4px;padding:12px;flex:1}
  .nav button{display:flex;align-items:center;gap:10px;background:none;color:#94a3b8;padding:9px 11px;border-radius:9px;font-size:14px;text-align:left;width:100%}
  .nav button:hover{background:#1e293b;color:#fff}
  .nav button.active{background:var(--accent);color:#fff}
  .nav svg{width:17px;height:17px;flex:0 0 17px}
  .sb-foot{padding:12px;border-top:1px solid #1e293b}
  .ucard{display:flex;align-items:center;gap:9px;background:#1e293b;border-radius:9px;padding:9px}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:0 0 32px}
  .uname{color:#fff;font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn-ghost{margin-top:8px;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;background:none;color:#cbd5e1;border:1px solid #334155;border-radius:9px;padding:7px;font-size:12px}
  .btn-ghost:hover{background:#1e293b}
  .content{flex:1;min-width:0;padding:24px 28px}

  .topbar{display:none;background:var(--ink);color:#fff;padding:12px 14px}

  /* Page header */
  .ph{margin-bottom:18px}
  .ph.blue{background:var(--ink);border-radius:12px;padding:18px 20px;color:#fff;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:22px 22px}
  .ph h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
  .ph p{margin:6px 0 0;font-size:14px;color:var(--muted)}
  .ph.blue h2{color:#fff} .ph.blue p{color:#cbd5e1}

  /* Cards & grid */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .card-h{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:8px}
  .card-b{padding:16px}
  .grid{display:grid;gap:14px}
  .g5{grid-template-columns:repeat(5,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .span2{grid-column:span 2}
  @media(max-width:1100px){.g5{grid-template-columns:repeat(3,1fr)}.g3,.g2{grid-template-columns:1fr}.span2{grid-column:auto}}

  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .kpi .val{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--ink2);margin-top:6px}
  .kpi .sub{font-size:12px;color:var(--muted)}
  .kpi .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
  .kpi .ic svg{width:16px;height:16px}

  /* Table */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px}
  td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
  .num{font-family:var(--mono)}
  .scroll{overflow-x:auto}

  /* Bits */
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%}
  .chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500}
  .chip.v{background:#d1fae5;color:#065f46}.chip.a{background:#fef3c7;color:#92400e}.chip.r{background:#fee2e2;color:#991b1b}
  .role{border-radius:6px;padding:2px 7px;font-size:10px;font-weight:600}
  .role.jefe{background:#dbeafe;color:#1e40af}.role.colaborador{background:#e2e8f0;color:#475569}.role.supervisor{background:#ede9fe;color:#6d28d9}
  .codetag{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--ink);color:#fff;border-radius:5px;padding:2px 7px}

  .devbar{height:10px;border-radius:999px;background:#e2e8f0;position:relative}
  .devbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
  .devbar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:#0f172a}
  .devsub{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px}

  /* Forms & buttons */
  label.fl{display:block;margin-bottom:12px}
  label.fl .t{display:block;font-size:12px;font-weight:500;color:#475569;margin-bottom:4px}
  input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:9px 11px;font-size:14px;font-family:inherit;background:#fff;color:var(--text)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.2)}
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:600}
  .btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-d)}
  .btn.dark{background:var(--ink2);color:#fff}.btn.dark:hover{background:var(--ink)}
  .btn.sm{padding:6px 11px;font-size:12px}
  .btn.line{background:#fff;border:1px solid #cbd5e1;color:#475569}.btn.line:hover{background:#f8fafc}
  .iconbtn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;color:#94a3b8;display:inline-flex}
  .iconbtn:hover{background:#fef2f2;color:#dc2626}
  .iconbtn svg{width:15px;height:15px}

  .alert{border-radius:9px;padding:10px 12px;font-size:14px}
  .alert.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
  .alert.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
  .pre{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;color:#334155}

  .commentbox{border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px;margin-top:6px}
  .commentbox .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px}
  .commentbox .meta .who{font-weight:500;color:#334155}
  .commentbox .meta .tm{margin-left:auto;font-family:var(--mono);font-size:10px;color:#94a3b8}
  .commentbox p{margin:5px 0 0;font-size:14px;color:#334155}
  .ck{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:1px solid #cbd5e1;border-radius:4px;background:#fff;cursor:pointer;flex:0 0 16px}
  .ck.done{background:var(--green);border-color:var(--green);color:#fff}
  .ent{display:flex;align-items:center;gap:8px;font-size:14px;margin:5px 0}
  .ent .lk{margin-left:auto;width:120px;font-size:11px;padding:3px 6px}
  .row-detail{background:#f8fafc}

  /* Centered screens (setup / login) */
  .screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .panel{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(15,23,42,.08)}
  .panel.wide{max-width:720px}
  .panel h1{font-size:22px;margin:6px 0 4px}
  .stepn{display:flex;gap:10px;margin:10px 0}
  .stepn .n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}
  .seg button{flex:1;background:#fff;padding:9px;font-size:14px;color:var(--muted)}
  .seg button.active{background:var(--accent);color:#fff}
  .muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
  .err{color:#b91c1c;font-size:13px;margin-top:8px}

  @media(max-width:820px){
    .layout{flex-direction:column}
    .sb{display:none}
    .topbar{display:block}
    .content{padding:16px}
    .tnav{display:flex;gap:8px;overflow-x:auto;padding-top:10px}
    .tnav button{flex:0 0 auto;background:#1e293b;color:#cbd5e1;border-radius:999px;padding:7px 13px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
    .tnav button.active{background:var(--accent);color:#fff}
    .tnav svg{width:15px;height:15px}
  }
</style>
</head>
<body>
<div id="app"><div class="screen"><div class="panel center"><p class="muted">Cargando…</p></div></div></div>

<script>
/* ===================================================================== */
/*  1) CONFIGURACIÓN  —  PEGA AQUÍ LOS DATOS DE TU PROYECTO FIREBASE      */
/*     (Consola Firebase ▸ Configuración del proyecto ▸ tus apps ▸ Web)   */
/* ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDzmn0KPAY2rImbU8okK1GXTm2VJPPx6MY",
  authDomain: "control-expedientes-3b21c.firebaseapp.com",
  projectId: "control-expedientes-3b21c",
  storageBucket: "control-expedientes-3b21c.firebasestorage.app",
  messagingSenderId: "316784239931",
  appId: "1:316784239931:web:6e57e4dd29375f28ce031e"
};

/*  Correos que serán JEFE de proyecto automáticamente (en minúsculas).   */
/*  Pon aquí TU correo para entrar como jefe sin tocar la consola.        */
const JEFE_EMAILS = ["darwinrumaldof18@gmail.com"];

/* ===================================================================== */
/*  2) APLICACIÓN (no necesitas editar de aquí para abajo)                */
/* ===================================================================== */
const SPECIALTIES=["Arquitectura","Estructuras","Inst. Sanitarias (IISS)","Inst. Eléctricas (IIEE)","Inst. Mecánicas (IIMM)","Metrados","Costos y Presupuestos","Especificaciones Técnicas","Cronograma","Estudios Básicos / Topografía","Coordinación y Compatibilización"];
const STATUS={verde:{lbl:"En meta",cls:"v",hex:"#10b981"},amarillo:{lbl:"En riesgo",cls:"a",hex:"#f59e0b"},rojo:{lbl:"Crítico",cls:"r",hex:"#ef4444"}};
const ROLE_LABEL={jefe:"Jefe de Proyecto",colaborador:"Colaborador",supervisor:"Supervisor"};
const NAV={
  jefe:[["resumen","Resumen","dash"],["proyectos","Proyectos","build"],["mis","Mis Tareas","list"],["equipo","Equipo","users"],["bitacora","Bitácora","hist"]],
  supervisor:[["resumen","Resumen","dash"],["proyectos","Proyectos","build"],["bitacora","Bitácora","hist"]],
  colaborador:[["resumen","Resumen","dash"],["proyectos","Proyectos","build"],["mis","Mis Tareas","list"]]
};
const ICONS={
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
  build:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 12H3M16 6H3M16 18H3M18 9l3 3-3 3"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  hist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>'
};

const fb={app:null,auth:null,fs:null};
const state={user:null,profile:null,tab:"resumen",pendingName:null,pendingRender:false,authMode:"login",charts:[]};
const data={projects:[],tasks:[],comments:[],logs:[],users:[]};

/* ---- utilidades ---- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const elapsedPct=p=>{const s=new Date(p.startDate+"T00:00:00"),e=new Date(p.endDate+"T00:00:00"),n=new Date();if(!p.startDate||!p.endDate)return 0;if(n<=s)return 0;if(n>=e)return 100;return Math.round((n-s)/(e-s)*100);};
const statusFor=(r,e)=>{const d=r-e;return d>=-5?"verde":d>=-15?"amarillo":"rojo";};
const fmtDate=iso=>!iso?"—":new Date(iso).toLocaleDateString("es-PE",{day:"2-digit",month:"2-digit",year:"numeric"});
const fmtDT=iso=>{const d=new Date(iso);return d.toLocaleDateString("es-PE",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"});};
const today=()=>new Date().toLocaleDateString("es-PE",{day:"2-digit",month:"2-digit",year:"numeric"});
const uById=id=>data.users.find(u=>u.id===id);
const pById=id=>data.projects.find(p=>p.id===id);
const cFor=tid=>data.comments.filter(c=>c.taskId===tid);
const initials=n=>{const p=(n||"?").trim().split(" ");return (p[p.length-1]||"?")[0].toUpperCase();};

function isConfigured(){
  if(typeof firebase==="undefined")return false;
  const c=FIREBASE_CONFIG;
  return c.apiKey && c.projectId && !JSON.stringify(c).includes("PEGAR_AQUI");
}

/* ===================== ARRANQUE ===================== */
window.addEventListener("DOMContentLoaded",()=>{
  if(!isConfigured()){renderSetup();return;}
  try{
    fb.app=firebase.initializeApp(FIREBASE_CONFIG);
    fb.auth=firebase.auth();
    fb.fs=firebase.firestore();
  }catch(e){renderSetup(e.message);return;}
  fb.auth.onAuthStateChanged(async user=>{
    if(user){
      state.user=user;
      try{ state.profile=await ensureProfile(user); }catch(e){ console.error(e); }
      attachListeners();
      state.tab="resumen";
      render();
    }else{
      state.user=null;state.profile=null;detachListeners();
      renderLogin();
    }
  });
  bindDelegation();
});

/* ===================== AUTENTICACIÓN ===================== */
async function ensureProfile(user){
  const ref=fb.fs.collection("users").doc(user.uid);
  const snap=await ref.get();
  const isJefe=(JEFE_EMAILS||[]).map(e=>(e||"").toLowerCase()).includes((user.email||"").toLowerCase());
  if(!snap.exists){
    const prof={name:state.pendingName||(user.email||"Usuario").split("@")[0],email:user.email||"",role:isJefe?"jefe":"colaborador",area:""};
    await ref.set(prof);state.pendingName=null;return {id:user.uid,...prof};
  }
  const prof=snap.data();
  if(isJefe && prof.role!=="jefe"){await ref.update({role:"jefe"});prof.role="jefe";}
  return {id:user.uid,...prof};
}
async function doLogin(){
  const em=val("li-email"),pw=val("li-pass");if(!em||!pw)return showErr("Escribe correo y contraseña.");
  try{await fb.auth.signInWithEmailAndPassword(em,pw);}catch(e){showErr(traduce(e.code));}
}
async function doRegister(){
  const nm=val("rg-name"),em=val("rg-email"),pw=val("rg-pass");
  if(!nm||!em||!pw)return showErr("Completa nombre, correo y contraseña.");
  if(pw.length<6)return showErr("La contraseña debe tener al menos 6 caracteres.");
  state.pendingName=nm;
  try{await fb.auth.createUserWithEmailAndPassword(em,pw);}catch(e){showErr(traduce(e.code));}
}
function doLogout(){fb.auth.signOut();}
function traduce(code){
  const m={"auth/invalid-credential":"Correo o contraseña incorrectos.","auth/wrong-password":"Contraseña incorrecta.","auth/user-not-found":"No existe una cuenta con ese correo.","auth/email-already-in-use":"Ese correo ya está registrado. Inicia sesión.","auth/invalid-email":"El correo no es válido.","auth/weak-password":"La contraseña es muy débil."};
  return m[code]||("No se pudo completar ("+code+").");
}

/* ===================== LISTENERS EN VIVO ===================== */
let unsubs=[];
function attachListeners(){
  detachListeners();
  const C=fb.fs;
  unsubs.push(C.collection("projects").onSnapshot(s=>{data.projects=s.docs.map(d=>({id:d.id,...d.data()}));maybeRender();},logErr));
  unsubs.push(C.collection("tasks").onSnapshot(s=>{data.tasks=s.docs.map(d=>({id:d.id,...d.data()}));maybeRender();},logErr));
  unsubs.push(C.collection("comments").orderBy("createdAt","desc").onSnapshot(s=>{data.comments=s.docs.map(d=>({id:d.id,...d.data()}));maybeRender();},logErr));
  unsubs.push(C.collection("logs").orderBy("at","desc").limit(120).onSnapshot(s=>{data.logs=s.docs.map(d=>({id:d.id,...d.data()}));maybeRender();},logErr));
  unsubs.push(C.collection("users").onSnapshot(s=>{data.users=s.docs.map(d=>({id:d.id,...d.data()}));maybeRender();},logErr));
}
function detachListeners(){unsubs.forEach(u=>{try{u();}catch(e){}});unsubs=[];}
function logErr(e){console.error("Firestore:",e);}

/* ===================== OPERACIONES ===================== */
async function addLog(msg){try{await fb.fs.collection("logs").add({who:state.profile.name,role:state.profile.role,msg,at:new Date().toISOString()});}catch(e){logErr(e);}}
async function saveProgress(taskId,pct,entregables){
  const t=data.tasks.find(x=>x.id===taskId);
  await fb.fs.collection("tasks").doc(taskId).update({pctReal:pct,entregables,updatedAt:new Date().toISOString(),updatedBy:state.profile.name});
  addLog(`Actualizó ${t.specialty} (${pById(t.projectId)?.code||"?"}) a ${pct}%`);
}
async function addComment(taskId,text,kind){
  await fb.fs.collection("comments").add({taskId,authorId:state.user.uid,authorName:state.profile.name,role:state.profile.role,kind,text,createdAt:new Date().toISOString()});
  const t=data.tasks.find(x=>x.id===taskId);
  addLog(`Comentó en ${t.specialty} (${pById(t.projectId)?.code||"?"})`);
}
async function addTask(o){
  await fb.fs.collection("tasks").add({...o,pctReal:0,updatedAt:new Date().toISOString(),updatedBy:state.profile.name});
  addLog(`Asignó ${o.specialty} (${pById(o.projectId)?.code||"?"}) a ${o.assigneeName}`);
}
async function addProject(o){await fb.fs.collection("projects").add({...o,createdAt:new Date().toISOString()});addLog(`Creó el expediente ${o.code} — ${o.name}`);}
async function setRole(uid,role){await fb.fs.collection("users").doc(uid).update({role});const u=uById(uid);addLog(`Cambió el rol de ${u?.name||"usuario"} a ${ROLE_LABEL[role]}`);}
async function setArea(uid,area){await fb.fs.collection("users").doc(uid).update({area});}
async function seedExample(){
  const me=state.user.uid,mn=state.profile.name;
  const E=(...n)=>n.map(x=>({name:x,link:"",done:false}));
  const projs=[
    {code:"ET-01",name:"Pistas y Veredas – Panao",location:"Pachitea, Huánuco",startDate:"2026-04-01",endDate:"2026-07-30"},

/* ---------- RESUMEN ---------- */
function viewResumen(){
  const T=data.tasks, espOf=t=>elapsedPct(pById(t.projectId)||{});
  const counts={verde:0,amarillo:0,rojo:0};let pend=0;
  T.forEach(t=>{counts[statusFor(t.pctReal,espOf(t))]++;pend+=(t.entregables||[]).filter(e=>!e.done).length;});
  const avg=T.length?Math.round(T.reduce((a,t)=>a+(t.pctReal||0),0)/T.length):0;
  if(!data.projects.length){
    return ph("Resumen Ejecutivo","Aún no hay expedientes cargados.",true)+
      `<div class="card"><div class="card-b center">
        <p class="muted">No hay datos todavía.${state.profile.role==="jefe"?" Crea tu primer expediente en <b>Proyectos</b> o carga un ejemplo para ver cómo funciona.":""}</p>
        ${state.profile.role==="jefe"?`<button class="btn primary" data-act="seed" style="margin-top:10px">Cargar datos de ejemplo</button>`:""}
      </div></div>`;
  }
  const kpi=(ic,tone,lbl,val,sub)=>`<div class="kpi"><div class="ic" style="background:${tone[0]};color:${tone[1]}">${ICONS[ic]}</div><div class="lbl">${lbl}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`;
  const atencion=T.map(t=>({t,e:espOf(t),s:statusFor(t.pctReal,espOf(t))})).filter(x=>x.s!=="verde").sort((a,b)=>(a.t.pctReal-a.e)-(b.t.pctReal-b.e));
  return ph("Resumen Ejecutivo",`Control al ${today()} · ${data.projects.length} expedientes · ${T.length} frentes de trabajo`,true)+`
  <div class="grid g5">
    ${kpi("build",["#dbeafe","#1d4ed8"],"Expedientes",data.projects.length,"en formulación")}
    ${kpi("dash",["#d1fae5","#047857"],"Avance global",avg+"%","promedio")}
    ${kpi("hist",["#fee2e2","#b91c1c"],"Críticos",counts.rojo,"🔴 acción")}
    ${kpi("list",["#fef3c7","#b45309"],"En riesgo",counts.amarillo,"🟡 vigilar")}
    ${kpi("users",["#e2e8f0","#475569"],"Entregables",pend,"pendientes")}
  </div>
  <div class="grid g3" style="margin-top:14px">
    <div class="card span2"><div class="card-h">Avance por expediente — real vs. esperado</div><div class="card-b"><div style="height:260px"><canvas id="chProj"></canvas></div></div></div>
    <div class="card"><div class="card-h">Estado de los frentes</div><div class="card-b"><div style="height:260px"><canvas id="chStatus"></canvas></div></div></div>
  </div>
  <div class="grid g3" style="margin-top:14px">
    <div class="card span2"><div class="card-h">Avance por especialidad</div><div class="card-b"><div style="height:260px"><canvas id="chSpec"></canvas></div></div></div>
    <div class="card"><div class="card-h">Avance global</div><div class="card-b center"><div style="font-family:var(--mono);font-size:46px;font-weight:700;color:var(--ink2)">${avg}%</div><div class="devbar" style="margin-top:10px"><div class="fill" style="width:${avg}%;background:var(--accent)"></div></div><p class="muted small" style="margin-top:8px">promedio de todos los frentes</p></div></div>
  </div>
  <div class="card" style="margin-top:14px"><div class="card-h">Atención requerida</div>
    ${atencion.length?`<div class="scroll"><table><thead><tr><th>Exp.</th><th>Especialidad</th><th>Responsable</th><th>Real</th><th>Desv.</th><th>Último bloqueo</th></tr></thead><tbody>
    ${atencion.map(({t,e,s})=>{const u=uById(t.assigneeId);const b=cFor(t.id).find(c=>c.kind==="justificacion");return `<tr><td><span class="codetag">${esc(pById(t.projectId)?.code||"?")}</span></td><td><span class="dot" style="background:${STATUS[s].hex}"></span> ${esc(t.specialty)}</td><td>${esc(u?.name||t.assigneeName||"—")}</td><td class="num">${t.pctReal}%</td><td class="num" style="color:#dc2626;font-weight:600">${t.pctReal-e}%</td><td class="muted">${b?esc(b.text):"— sin justificación —"}</td></tr>`;}).join("")}
    </tbody></table></div>`:`<div class="card-b"><p style="color:#047857;margin:0">Todos los frentes están en meta. Sin alertas.</p></div>`}
  </div>`;
}

/* ---------- PROYECTOS ---------- */
function viewProyectos(){
  const role=state.profile.role, canComment=role==="jefe"||role==="supervisor";
  let html=ph("Proyectos — Tablero de Control", role==="colaborador"?"Puedes ver el avance de todo el equipo (solo lectura). Tu propio avance se edita en “Mis Tareas”.":"% esperado por tiempo transcurrido (lineal). La línea en la barra marca el avance esperado.");
  if(role==="jefe")html+=`<div style="margin-bottom:14px"><button class="btn line sm" data-act="newproj">+ Nuevo expediente</button></div><div id="projForm"></div>`;
  if(!data.projects.length)return html+`<div class="card"><div class="card-b center"><p class="muted">Sin expedientes.${role==="jefe"?` <button class="btn primary sm" data-act="seed">Cargar ejemplo</button>`:""}</p></div></div>`;
  data.projects.forEach(p=>{
    const esp=elapsedPct(p),pt=data.tasks.filter(t=>t.projectId===p.id);
    const reals=pt.map(t=>t.pctReal||0),avg=reals.length?Math.round(reals.reduce((a,b)=>a+b,0)/reals.length):0;
    const pst=STATUS[statusFor(avg,esp)];
    const alerts=[];const arq=pt.find(t=>t.specialty.startsWith("Arquitectura")),est=pt.find(t=>t.specialty.startsWith("Estructuras"));
    if(arq&&est&&arq.pctReal-est.pctReal>40)alerts.push(`Riesgo de incompatibilidad: Arquitectura (${arq.pctReal}%) muy por delante de Estructuras (${est.pctReal}%). Estructuras puede estar diseñando sobre planos no definitivos.`);
    if(reals.length){const gap=Math.max(...reals)-Math.min(...reals);if(gap>=50)alerts.push(`Avance muy disparejo entre especialidades (brecha de ${gap} puntos). Revisar dependencias.`);}
    const criticos=pt.filter(t=>statusFor(t.pctReal,esp)==="rojo");
    const acciones=pt.filter(t=>statusFor(t.pctReal,esp)!=="verde");
    html+=`<section class="card" style="margin-bottom:18px;overflow:hidden">
      <div class="card-h" style="background:#f8fafc;display:flex;gap:12px;align-items:center">
        <span class="codetag">${esc(p.code)}</span>
        <div><div>${esc(p.name)}</div><div class="muted small">${esc(p.location||"")} · ${fmtDate(p.startDate)} → ${fmtDate(p.endDate)}</div></div>
        <div style="margin-left:auto;display:flex;gap:18px;align-items:center;text-align:right">
          <div><div class="muted small mono">tiempo</div><div class="mono" style="font-size:18px;font-weight:700">${esp}%</div></div>
          <div><div class="muted small mono">avance</div><div class="mono" style="font-size:18px;font-weight:700;color:${pst.hex}">${avg}%</div></div>
          <span class="chip ${pst.cls}"><span class="dot" style="background:${pst.hex}"></span>${pst.lbl}</span>
        </div>
      </div>
      <div class="scroll"><table><thead><tr><th>Especialidad / Responsable</th><th>Esp.</th><th>Real</th><th>Desv.</th><th>Avance vs esperado</th><th>Estado</th><th>Entregable crítico</th><th></th></tr></thead><tbody>
      ${pt.map(t=>rowTask(t,esp,canComment)).join("")||`<tr><td colspan="8" class="muted">Sin frentes asignados.</td></tr>`}
      </tbody></table></div>
      <div class="card-b" style="border-top:1px solid var(--line)">
        <div class="muted small" style="text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:6px">⚠ Auditoría de consistencia</div>
        ${(alerts.length||criticos.length)?`<ul style="margin:0;padding-left:18px;font-size:14px">
          ${alerts.map(a=>`<li style="color:#92400e">${esc(a)}</li>`).join("")}
          ${criticos.map(t=>{const b=cFor(t.id).find(c=>c.kind==="justificacion");return `<li style="color:#b91c1c"><b>${esc(t.specialty)}</b> en estado crítico. ${b?`Bloqueo: "${esc(b.text)}"`:"Sin justificación registrada."}</li>`;}).join("")}
        </ul>`:`<p style="color:#047857;margin:0">Sin incoherencias detectadas.</p>`}
      </div>
      ${role==="jefe"&&acciones.length?`<div class="card-b" style="border-top:1px solid var(--line);background:#f8fafc">
        <div class="muted small" style="text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:8px">📝 Acciones directas — listas para enviar</div>
        ${acciones.map(t=>{const u=uById(t.assigneeId);const msg=buildAction(t,p,esp);return `<div class="card" style="margin-bottom:8px"><div class="card-b"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><b class="small">Para: ${esc(u?.name||t.assigneeName||"—")}</b><button class="btn dark sm" style="margin-left:auto" data-act="copy" data-id="${t.id}">Copiar</button></div><pre class="pre" id="msg-${t.id}">${esc(msg)}</pre></div></div>`;}).join("")}
      </div>`:""}
    </section>`;
  });
  return html;
}
function rowTask(t,esp,canComment){
  const st=STATUS[statusFor(t.pctReal,esp)],u=uById(t.assigneeId),desv=t.pctReal-esp;
  const pendiente=(t.entregables||[]).filter(e=>!e.done).map(e=>e.name)[0]||"—";
  return `<tr><td><div style="font-weight:500">${esc(t.specialty)}</div><div class="muted small">${esc(u?.name||t.assigneeName||"—")}</div></td>
  <td class="num center">${esp}%</td><td class="num center" style="font-weight:600">${t.pctReal}%</td>
  <td class="num center" style="color:${desv<0?"#dc2626":"#059669"};font-weight:600">${desv>0?"+":""}${desv}%</td>
  <td><div style="width:120px"><div class="devbar"><div class="fill" style="width:${t.pctReal}%;background:${st.hex}"></div><div class="tick" style="left:${Math.min(esp,100)}%"></div></div></div></td>
  <td class="center"><span class="chip ${st.cls}"><span class="dot" style="background:${st.hex}"></span></span></td>
  <td class="muted small">${esc(pendiente)}</td>
  <td class="center"><button class="btn line sm" data-act="detail" data-id="${t.id}">ver</button></td></tr>
  <tr class="row-detail" id="det-${t.id}" style="display:none"><td colspan="8">
    <div class="grid g2">
      <div><div class="muted small" style="font-weight:600;text-transform:uppercase;margin-bottom:6px">Entregables</div>
        ${entList(t.entregables,false,t.id)}
        <div class="muted mono" style="font-size:11px;margin-top:8px">Última actualización: ${t.updatedAt?fmtDT(t.updatedAt):"—"} · ${esc(t.updatedBy||"")}</div></div>
      <div><div class="muted small" style="font-weight:600;text-transform:uppercase;margin-bottom:6px">Comentarios y observaciones</div>
        ${commentThread(cFor(t.id))}
        ${canComment?`<div style="display:flex;gap:8px;margin-top:8px"><input id="fb-${t.id}" placeholder="¿Vamos bien o mal? Deja tu observación…"/><button class="btn dark sm" data-act="feedback" data-id="${t.id}">Enviar</button></div>`:""}
      </div>
    </div></td></tr>`;
}
function buildAction(t,p,esp){
  const desv=t.pctReal-esp,pend=(t.entregables||[]).filter(e=>!e.done).map(e=>e.name);
  const L=[`*[${p.code} · ${p.name}] Subsanación — ${t.specialty}*`,`Control al ${today()}: avance ${t.pctReal}% vs ${esp}% esperado (desviación ${desv}%). Requiero regularizar:`];
  pend.length?pend.forEach(x=>L.push("☐ "+x)):L.push("☐ Actualizar entregables y % de avance");
  if(t.dueDate)L.push("Fecha límite de subsanación: "+fmtDate(t.dueDate));
  L.push("Por favor confirmar recepción y nueva fecha de cumplimiento.");
  return L.join("\n");
}

/* ---------- helpers de render ---------- */
function ph(t,s,blue){return `<div class="ph ${blue?"blue":""}"><h2>${esc(t)}</h2>${s?`<p>${esc(s)}</p>`:""}</div>`;}
function entList(arr,editable,tid){arr=arr||[];return arr.map((e,i)=>`<div class="ent">
  <span class="ck ${e.done?"done":""}" ${editable?`data-act="toggle" data-id="${tid}" data-i="${i}"`:""}>${e.done?"✓":""}</span>
  <span style="${e.done?"color:#94a3b8;text-decoration:line-through":""}">${esc(e.name)}</span>
  ${editable?`<input class="lk" data-act="link" data-id="${tid}" data-i="${i}" value="${esc(e.link||"")}" placeholder="enlace…"/>`:(e.link?`<a class="lk" href="${esc(e.link)}" target="_blank">subido</a>`:"")}</div>`).join("")||`<div class="muted small">Sin entregables.</div>`;}
function commentThread(cs){if(!cs.length)return `<div class="muted small" style="font-style:italic">Sin comentarios aún.</div>`;
  return cs.map(c=>`<div class="commentbox"><div class="meta"><span class="who">${esc(c.authorName)}</span><span class="role ${c.role}">${ROLE_LABEL[c.role]||c.role}</span>${c.kind==="justificacion"?`<span class="role" style="background:#fef3c7;color:#92400e">Justificación</span>`:""}<span class="tm">${fmtDT(c.createdAt)}</span></div><p>${esc(c.text)}</p></div>`).join("");}

/* ---------- gráficos ---------- */
function initCharts(){
  if(typeof Chart==="undefined")return;
  state.charts.forEach(c=>{try{c.destroy();}catch(e){}});state.charts=[];
  const T=data.tasks,espOf=t=>elapsedPct(pById(t.projectId)||{});
  const projRows=data.projects.map(p=>{const pt=T.filter(t=>t.projectId===p.id);const r=pt.length?Math.round(pt.reduce((a,t)=>a+(t.pctReal||0),0)/pt.length):0;return {name:p.code,real:r,esp:elapsedPct(p)};});
  const bySpec={};T.forEach(t=>{const k=t.specialty.replace(/ \(.*\)/,"").split(" / ")[0];(bySpec[k]=bySpec[k]||{r:[],e:[]});bySpec[k].r.push(t.pctReal||0);bySpec[k].e.push(espOf(t));});
  const specRows=Object.entries(bySpec).map(([k,v])=>({name:k,real:Math.round(v.r.reduce((a,b)=>a+b,0)/v.r.length),esp:Math.round(v.e.reduce((a,b)=>a+b,0)/v.e.length)}));
  const counts={verde:0,amarillo:0,rojo:0};T.forEach(t=>counts[statusFor(t.pctReal,espOf(t))]++);
  const opt={responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,max:100,ticks:{font:{size:11}}},x:{ticks:{font:{size:11}}}},plugins:{legend:{labels:{font:{size:12},boxWidth:12}}}};
  const c1=document.getElementById("chProj");
  if(c1)state.charts.push(new Chart(c1,{type:"bar",data:{labels:projRows.map(r=>r.name),datasets:[{label:"Esperado",data:projRows.map(r=>r.esp),backgroundColor:"#94a3b8",borderRadius:4},{label:"Real",data:projRows.map(r=>r.real),backgroundColor:"#2563eb",borderRadius:4}]},options:opt}));
  const c2=document.getElementById("chStatus");
  if(c2)state.charts.push(new Chart(c2,{type:"doughnut",data:{labels:["En meta","En riesgo","Crítico"],datasets:[{data:[counts.verde,counts.amarillo,counts.rojo],backgroundColor:["#10b981","#f59e0b","#ef4444"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"bottom",labels:{font:{size:12},boxWidth:12}}}}}));
  const c3=document.getElementById("chSpec");
  if(c3)state.charts.push(new Chart(c3,{type:"bar",data:{labels:specRows.map(r=>r.name),datasets:[{label:"Esperado",data:specRows.map(r=>r.esp),backgroundColor:"#94a3b8",borderRadius:4},{label:"Real",data:specRows.map(r=>r.real),backgroundColor:"#2563eb",borderRadius:4}]},options:opt}));
}

/* ===================== EVENTOS (delegación) ===================== */
function bindDelegation(){
  const app=document.getElementById("app");
  app.addEventListener("focusout",()=>{ if(state.pendingRender){state.pendingRender=false; setTimeout(()=>{ if(!(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) render(); },120);} });
  app.addEventListener("input",e=>{
    const t=e.target,act=t.getAttribute&&t.getAttribute("data-act");
    if(act==="slide"){const id=t.dataset.id;const bar=document.getElementById("bar-"+id),lbl=document.getElementById("lbl-"+id);if(bar)bar.style.width=t.value+"%";if(lbl)lbl.textContent="real "+t.value+"%";}
  });
  app.addEventListener("click",async e=>{
    const b=e.target.closest("[data-act]");if(!b)return;
    const act=b.dataset.act,id=b.dataset.id;
    if(act==="tab"){state.tab=id;render();return;}
    if(act==="logout"){doLogout();return;}
    if(act==="refresh"){render();return;}
    if(act==="authmode"){state.authMode=id;renderLogin();return;}
    if(act==="login"){doLogin();return;}
    if(act==="register"){doRegister();return;}
    if(act==="seed"){b.textContent="Cargando…";try{await seedExample();}catch(err){alert("Error al cargar ejemplo: "+err.message);}return;}
    if(act==="detail"){const r=document.getElementById("det-"+id);if(r)r.style.display=r.style.display==="none"?"table-row":"none";return;}
    if(act==="toggle"){const t=data.tasks.find(x=>x.id===id);const i=+b.dataset.i;const ent=(t.entregables||[]).map((x,j)=>j===i?{...x,done:!x.done}:x);b.classList.toggle("done");b.textContent=b.classList.contains("done")?"✓":"";t._draftEnt=ent;return;}
    if(act==="save"){await doSave(id,b);return;}
    if(act==="justif"){const v=val("jf-"+id);if(v){b.disabled=true;await addComment(id,v,"justificacion");}return;}
    if(act==="feedback"){const v=val("fb-"+id);if(v){b.disabled=true;await addComment(id,v,"feedback");}return;}
    if(act==="assign"){await doAssign(b);return;}
    if(act==="copy"){const el=document.getElementById("msg-"+id);copyText(el?el.textContent:"",b);return;}
    if(act==="newproj"){renderProjForm();return;}
    if(act==="saveproj"){await doSaveProj(b);return;}
  });
  app.addEventListener("change",async e=>{
    const b=e.target.closest("[data-act]");if(!b)return;
    if(b.dataset.act==="role"){await setRole(b.dataset.id,b.value);}
    if(b.dataset.act==="link"){const t=data.tasks.find(x=>x.id===b.dataset.id);const i=+b.dataset.i;t._draftEnt=(t._draftEnt||t.entregables||[]).map((x,j)=>j===i?{...x,link:b.value}:x);}
  });
}
async function doSave(id,btn){
  const t=data.tasks.find(x=>x.id===id);const slider=document.querySelector(`input[data-act="slide"][data-id="${id}"]`);
  const pct=slider?+slider.value:t.pctReal;const ent=t._draftEnt||t.entregables||[];
  btn.disabled=true;btn.textContent="Guardando…";
  try{await saveProgress(id,pct,ent);delete t._draftEnt;btn.textContent="Guardado ✓";}catch(err){alert("Error al guardar: "+err.message);btn.disabled=false;btn.textContent="Guardar avance";}
}
async function doAssign(btn){
  const pid=val("as-proj");if(!pid)return alert("Crea o selecciona un expediente.");
  const u=uById(val("as-user"));const ent=val("as-ent").split("\n").map(s=>s.trim()).filter(Boolean).map(n=>({name:n,link:"",done:false}));
  btn.disabled=true;
  try{await addTask({projectId:pid,specialty:val("as-spec"),assigneeId:u.id,assigneeName:u.name,dueDate:val("as-due"),entregables:ent.length?ent:[{name:val("as-spec"),link:"",done:false}]});}catch(err){alert("Error: "+err.message);}
  btn.disabled=false;
}
function renderProjForm(){
  const c=document.getElementById("projForm");if(!c)return;
  c.innerHTML=`<div class="card" style="margin-bottom:14px"><div class="card-b"><div class="grid g2">
    <label class="fl"><span class="t">Código</span><input id="np-code" placeholder="ET-04"/></label>
    <label class="fl"><span class="t">Nombre</span><input id="np-name" placeholder="Mejoramiento de…"/></label>
    <label class="fl"><span class="t">Ubicación</span><input id="np-loc" placeholder="Distrito, Región"/></label>
    <label class="fl"><span class="t">Fecha de inicio</span><input type="date" id="np-start"/></label>
    <label class="fl"><span class="t">Fecha de fin</span><input type="date" id="np-end"/></label>
  </div><button class="btn primary" data-act="saveproj">Crear expediente</button></div></div>`;
}
async function doSaveProj(btn){
  const code=val("np-code"),name=val("np-name");if(!code||!name)return alert("Código y nombre son obligatorios.");
  btn.disabled=true;
  try{await addProject({code,name,location:val("np-loc"),startDate:val("np-start"),endDate:val("np-end")});}catch(err){alert("Error: "+err.message);btn.disabled=false;}
}
function copyText(txt,btn){
  const done=()=>{const o=btn.textContent;btn.textContent="Copiado ✓";setTimeout(()=>btn.textContent=o,1500);};
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));}else fallbackCopy(txt,done);
}
function fallbackCopy(txt,cb){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);cb&&cb();}
