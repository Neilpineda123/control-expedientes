.card-h{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.grid{display:grid;gap:14px}

.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kpi .val{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--ink2);margin-top:6px}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:2px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
.num{font-family:var(--mono)}.scroll{overflow-x:auto}

.devbar{height:10px;border-radius:999px;background:#e2e8f0;position:relative}
.devbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.devbar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:#0f172a}
.devsub{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px}
label.fl{display:block;margin-bottom:12px}
label.fl .t{display:block;font-size:12px;font-weight:500;color:#475569;margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:9px 11px;font-size:14px;font-family:inherit;background:#fff;color:var(--text)}

.btn.sm{padding:6px 11px;font-size:12px}
.btn.line{background:#fff;border:1px solid #cbd5e1;color:#475569}.btn.line:hover{background:#f8fafc}

.btn.warn{background:#f59e0b;color:#fff}
.iconbtn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;color:#94a3b8;display:inline-flex}

.iconbtn svg{width:15px;height:15px}
.alert{border-radius:9px;padding:10px 12px;font-size:14px}
.alert.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.alert.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.pre{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;color:#334155}
.commentbox{border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px;margin-top:6px}
.commentbox .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px}
.commentbox .meta .who{font-weight:500;color:#334155}

.modal-b{padding:16px 20px}

.wkitem.extra{background:#fef3c7;color:#92400e}

.tplbox b{color:var(--ink2)}
.tplbox ul{margin:4px 0 6px;padding-left:18px}
.tplbox li{margin:1px 0}
.tplsel{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 12px}
.tplopt{border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:#fff;font-size:13px}
.tplopt:hover{border-color:var(--accent)}
.tplopt.sel{border-color:var(--accent);background:#eff6ff}
.tplopt b{display:block;color:var(--ink2);font-weight:600;margin-bottom:2px}
.tplopt small{color:var(--muted);font-size:11px}
.cap-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}

.cap-row select{width:auto;min-width:140px;padding:4px 6px;font-size:12px}
.diff{font-family:var(--mono);font-size:11px;font-weight:600}

@media(max-width:820px){.layout{flex-direction:column}.sb{display:none}.topbar{display:block}.content{padding:16px}.tnav{display:flex;gap:8px;overflow-x:auto;padding-top:10px}.tnav button{flex:0 0 auto;background:#1e293b;color:#cbd5e1;border-radius:999px;padding:7px 13px;font-size:13px;display:inline-flex;align-items:center;gap:6px}.tnav button.active{background:var(--accent);color:#fff}.tnav svg{width:15px;height:15px}.kanban{grid-template-columns:repeat(5,260px)}.weekgrid{grid-template-columns:120px repeat(6,140px);overflow-x:auto}}
</style>

async function ensureProfile(user){
  const ref=fb.fs.collection("users").doc(user.uid);
  const snap=await ref.get();
  const isJefe=(JEFE_EMAILS||[]).map(e=>(e||"").toLowerCase()).includes((user.email||"").toLowerCase());
  if(!snap.exists){
    const prof={name:state.pendingName||(user.email||"Usuario").split("@")[0],email:user.email||"",role:isJefe?"jefe":"colaborador",area:""};
    await ref.set(prof);state.pendingName=null;return {id:user.uid,...prof};
  }
  const prof=snap.data();
  if(isJefe&&prof.role!=="jefe"){await ref.update({role:"jefe"});prof.role="jefe";}
  return {id:user.uid,...prof};
}
async function doLogin(){const em=val("li-email"),pw=val("li-pass");if(!em||!pw)return showErr("Escribe correo y contraseña.");try{await fb.auth.signInWithEmailAndPassword(em,pw);}catch(e){showErr(traduce(e.code));}}
async function doRegister(){const nm=val("rg-name"),em=val("rg-email"),pw=val("rg-pass");if(!nm||!em||!pw)return showErr("Completa nombre, correo y contraseña.");if(pw.length<6)return showErr("Mínimo 6 caracteres.");state.pendingName=nm;try{await fb.auth.createUserWithEmailAndPassword(em,pw);}catch(e){showErr(traduce(e.code));}}
function doLogout(){fb.auth.signOut();}
function traduce(c){const m={"auth/invalid-credential":"Correo o contraseña incorrectos.","auth/wrong-password":"Contraseña incorrecta.","auth/user-not-found":"No existe esa cuenta.","auth/email-already-in-use":"Correo ya registrado.","auth/invalid-email":"Correo no válido.","auth/weak-password":"Contraseña muy débil."};return m[c]||("Error: "+c);}

function attachListeners(){
  detachListeners();const C=fb.fs;
  unsubs.push(C.collection("projects").onSnapshot(s=>{data.projects=s.docs.map(d=>({id:d.id,...d.data()}));render();}));
  unsubs.push(C.collection("tasks").onSnapshot(s=>{data.tasks=s.docs.map(d=>({id:d.id,...d.data()}));render();}));
  unsubs.push(C.collection("comments").orderBy("createdAt","desc").onSnapshot(s=>{data.comments=s.docs.map(d=>({id:d.id,...d.data()}));render();}));
  unsubs.push(C.collection("logs").orderBy("at","desc").limit(150).onSnapshot(s=>{data.logs=s.docs.map(d=>({id:d.id,...d.data()}));render();}));
  unsubs.push(C.collection("users").onSnapshot(s=>{data.users=s.docs.map(d=>({id:d.id,...d.data()}));render();}));
  unsubs.push(C.collection("weekly_plan").onSnapshot(s=>{data.weekly=s.docs.map(d=>({id:d.id,...d.data()}));render();}));
  unsubs.push(C.collection("daily_logs").onSnapshot(s=>{data.daily=s.docs.map(d=>({id:d.id,...d.data()}));render();}));

}

function ph(t,s,blue){return `<div class="ph ${blue?"blue":""}"><h2>${esc(t)}</h2>${s?`<p>${esc(s)}</p>`:""}</div>`;}

/* ============ RESUMEN ============ */
function viewResumen(){
  const T=data.tasks,P=data.projects;
  const activos=P.filter(p=>p.status==="activo"||!p.status);
  const paralizados=P.filter(p=>p.status==="paralizado");
  const cerrados=P.filter(p=>p.status==="cerrado");
  const obs=P.filter(p=>p.status==="observacion");
  const espOf=t=>elapsedPct(pById(t.projectId)||{});
  const activeTasks=T.filter(t=>{const p=pById(t.projectId);return p&&(p.status==="activo"||p.status==="observacion"||!p.status);});
  const counts={verde:0,amarillo:0,rojo:0};let pend=0;
  activeTasks.forEach(t=>{counts[statusFor(t.pctReal,espOf(t))]++;pend+=(t.entregables||[]).filter(e=>!e.done).length;});
  const avg=activeTasks.length?Math.round(activeTasks.reduce((a,t)=>a+(t.pctReal||0),0)/activeTasks.length):0;
  const today=todayISO();
  const myDailyToday=data.daily.filter(d=>d.userId===state.user.uid&&d.date===today).length;
  const sinReg=data.users.filter(u=>u.role!=="supervisor"&&!data.daily.some(d=>d.userId===u.id&&d.date===today)).length;
  if(!P.length){
    return ph("Resumen Ejecutivo","Aún no hay expedientes cargados.",true)+
      `<div class="card"><div class="card-b" style="text-align:center"><p style="color:var(--muted)">No hay datos todavía.${state.profile.role==="jefe"?" Crea tu primer expediente en <b>Proyectos</b>.":""}</p></div></div>`;
  }
  const kpi=(ic,tone,lbl,val,sub)=>`<div class="kpi"><div class="ic" style="background:${tone[0]};color:${tone[1]}">${ICONS[ic]}</div><div class="lbl">${lbl}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`;
  return ph("Resumen Ejecutivo",`Control al ${today.split("-").reverse().join("/")} · ${activos.length} activos · ${paralizados.length} paralizados · ${cerrados.length} cerrados`,true)+`
  <div class="grid g5">
    ${kpi("build",["#dbeafe","#1d4ed8"],"Activos",activos.length,"en desarrollo")}
    ${kpi("dash",["#d1fae5","#047857"],"Avance global",avg+"%","de los activos")}
    ${kpi("hist",["#fee2e2","#b91c1c"],"Críticos",counts.rojo,"🔴 acción")}
    ${kpi("reg",["#fef3c7","#b45309"],"Hoy",myDailyToday,"registros tuyos")}
    ${kpi("users",["#ede9fe","#6d28d9"],"Sin registro",sinReg,"hoy del equipo")}
  </div>
  <div class="grid g3" style="margin-top:14px">
    <div class="card span2"><div class="card-h">Avance por expediente activo — real vs. esperado</div><div class="card-b"><div style="height:260px"><canvas id="chProj"></canvas></div></div></div>
    <div class="card"><div class="card-h">Estado de frentes</div><div class="card-b"><div style="height:260px"><canvas id="chStatus"></canvas></div></div></div>
  </div>
  ${obs.length||paralizados.length?`
  <div class="grid g2" style="margin-top:14px">
    ${paralizados.length?`<div class="card"><div class="card-h">⏸️ Expedientes paralizados</div><div class="card-b">${paralizados.map(p=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="codetag paus">${esc(p.code)}</span> <b>${esc(p.name)}</b><div style="font-size:12px;color:var(--muted)">${esc(p.pauseReason||"Sin motivo registrado")}</div></div>`).join("")}</div></div>`:""}
    ${obs.length?`<div class="card"><div class="card-h">🔄 En observaciones</div><div class="card-b">${obs.map(p=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="codetag obs">${esc(p.code)}</span> <b>${esc(p.name)}</b></div>`).join("")}</div></div>`:""}
  </div>`:""}`;
}

function initCharts(){
  if(typeof Chart==="undefined")return;
  state.charts.forEach(c=>{try{c.destroy();}catch(e){}});state.charts=[];
  const T=data.tasks,P=data.projects.filter(p=>p.status==="activo"||p.status==="observacion"||!p.status);
  const espOf=t=>elapsedPct(pById(t.projectId)||{});
  const projRows=P.map(p=>{const pt=T.filter(t=>t.projectId===p.id);const r=pt.length?Math.round(pt.reduce((a,t)=>a+(t.pctReal||0),0)/pt.length):0;return {name:p.code,real:r,esp:elapsedPct(p)};});
  const counts={verde:0,amarillo:0,rojo:0};T.forEach(t=>{const p=pById(t.projectId);if(p&&(p.status==="activo"||p.status==="observacion"||!p.status))counts[statusFor(t.pctReal,espOf(t))]++;});
  const opt={responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,max:100,ticks:{font:{size:11}}},x:{ticks:{font:{size:11}}}},plugins:{legend:{labels:{font:{size:12},boxWidth:12}}}};
  const c1=document.getElementById("chProj");
  if(c1&&projRows.length)state.charts.push(new Chart(c1,{type:"bar",data:{labels:projRows.map(r=>r.name),datasets:[{label:"Esperado",data:projRows.map(r=>r.esp),backgroundColor:"#94a3b8",borderRadius:4},{label:"Real",data:projRows.map(r=>r.real),backgroundColor:"#2563eb",borderRadius:4}]},options:opt}));
  const c2=document.getElementById("chStatus");
  if(c2)state.charts.push(new Chart(c2,{type:"doughnut",data:{labels:["En meta","En riesgo","Crítico"],datasets:[{data:[counts.verde,counts.amarillo,counts.rojo],backgroundColor:["#10b981","#f59e0b","#ef4444"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"bottom",labels:{font:{size:12},boxWidth:12}}}}}));
}

/* ============ PROYECTOS ============ */
function viewProyectos(){
  const role=state.profile.role;
  const filter=state.projFilter;const q=state.projSearch.toLowerCase();
  let projs=data.projects.slice();
  if(filter==="mios")projs=projs.filter(p=>data.tasks.some(t=>t.projectId===p.id&&t.assigneeId===state.user.uid));
  else if(filter!=="all")projs=projs.filter(p=>(p.status||"activo")===filter);
  if(q)projs=projs.filter(p=>(p.code+" "+p.name).toLowerCase().includes(q));
  projs.sort((a,b)=>(a.code||"").localeCompare(b.code||""));
  const counts={activo:0,paralizado:0,cerrado:0,observacion:0,total:data.projects.length};
  data.projects.forEach(p=>counts[p.status||"activo"]++);
  let html=ph("Proyectos — Tablero de Control","% esperado por tiempo transcurrido. Línea = avance esperado.");
  html+=`<div class="filterbar">
    <button class="fchip ${filter==="activo"?"active":""}" data-act="pfilter" data-id="activo">🟢 Activos (${counts.activo})</button>
    <button class="fchip ${filter==="paralizado"?"active":""}" data-act="pfilter" data-id="paralizado">⏸️ Paralizados (${counts.paralizado})</button>
    <button class="fchip ${filter==="observacion"?"active":""}" data-act="pfilter" data-id="observacion">🔄 Observaciones (${counts.observacion})</button>
    <button class="fchip ${filter==="cerrado"?"active":""}" data-act="pfilter" data-id="cerrado">✅ Cerrados (${counts.cerrado})</button>
    <button class="fchip ${filter==="mios"?"active":""}" data-act="pfilter" data-id="mios">👤 Mis expedientes</button>
    <button class="fchip ${filter==="all"?"active":""}" data-act="pfilter" data-id="all">Todos (${counts.total})</button>
    <input id="psearch" placeholder="Buscar por código o nombre..." value="${esc(state.projSearch)}" style="margin-left:auto;max-width:280px" oninput="state.projSearch=this.value;clearTimeout(window._st);window._st=setTimeout(render,200)"/>
    ${role==="jefe"?`<button class="btn primary sm" data-act="newproj">+ Nuevo expediente</button>`:""}
  </div>`;
  if(!projs.length)return html+`<div class="card"><div class="card-b" style="text-align:center"><p style="color:var(--muted)">No hay expedientes en esta vista.</p></div></div>`;
  projs.forEach(p=>{html+=renderProject(p,role);});
  return html;
}

      <div style="display:flex;gap:14px;align-items:center">
        <div style="text-align:right"><div style="font-size:10px;color:var(--muted);font-family:var(--mono)">tiempo</div><div class="mono" style="font-size:16px;font-weight:600">${esp}%</div></div>
        <div style="text-align:right"><div style="font-size:10px;color:var(--muted);font-family:var(--mono)">avance</div><div class="mono" style="font-size:16px;font-weight:600;color:${pst.hex}">${avg}%</div></div>
        <span class="chip ${ps.cls}">${ps.emoji} ${ps.lbl}</span>

      </div></div>`:""}
    ${p.pauseReason&&p.status==="paralizado"?`<div style="padding:10px 16px;background:#fffbeb;border-bottom:1px solid var(--line);font-size:13px;color:#92400e"><b>Motivo de pausa:</b> ${esc(p.pauseReason)}</div>`:""}

    ${pt.length?`<div class="scroll"><table><thead><tr><th>Capítulo / Responsable</th><th>Esp.</th><th>Real</th><th>Desv.</th><th>Avance</th><th>Estado</th><th></th></tr></thead><tbody>
      ${pt.map(t=>rowTask(t,p.status==="cerrado"?100:esp,role==="jefe"||role==="supervisor")).join("")}

function renderKCard(t){

async function dropCard(col){

  try{await fb.fs.collection("tasks").doc(t.id).update({kanbanCol:col,updatedAt:new Date().toISOString(),updatedBy:state.profile.name});addLog(`Movió ${t.specialty} a "${KANBAN_COLS.find(c=>c.id===col).name}"`);}catch(e){alert("Error: "+e.message);}

function viewSemana(){
  const role=state.profile.role;
  const start=getWeekStart(state.weekOffset),days=weekDays(start);
  const startISO=isoOfDate(start);
  let users=data.users.filter(u=>u.role!=="supervisor");

  const weekItems=data.weekly.filter(w=>w.weekStart===startISO);
  const head=`<div class="filterbar">
    <button class="btn line sm" onclick="state.weekOffset--;render()">◀ Semana anterior</button>
    <b style="margin:0 12px">Semana del ${fmtDate(days[0].toISOString())} al ${fmtDate(days[5].toISOString())}</b>
    <button class="btn line sm" onclick="state.weekOffset++;render()">Semana siguiente ▶</button>
    <button class="btn line sm" onclick="state.weekOffset=0;render()" style="margin-left:auto">Hoy</button>
    ${role==="jefe"?`<button class="btn primary sm" onclick="openWeekItem('${startISO}',null,null)">+ Planificar tarea</button>`:""}
  </div>`;
  let html=ph(role==="colaborador"?"Mi Semana":"Programación Semanal",role==="colaborador"?"Lo que se planificó para mí esta semana. Marca como hecho cuando termines.":role==="jefe"?"Define qué hace cada persona cada día. Los supervisores pueden comentar.":"Vista de la programación semanal de todo el equipo.");
  html+=head;
  if(!users.length)return html+`<div class="card"><div class="card-b" style="text-align:center;color:var(--muted)">No hay colaboradores.</div></div>`;
  html+=`<div class="scroll"><div class="weekgrid"><div class="wh">Persona</div>${days.map(d=>{const iso=isoOfDate(d);const fer=isHoliday(iso);return `<div class="wh" style="text-align:center;${fer?"background:#fef2f2":""}">${["LUN","MAR","MIÉ","JUE","VIE","SÁB"][d.getDay()===0?6:d.getDay()-1]}<br><span style="font-family:var(--mono);font-weight:400">${d.getDate()}/${d.getMonth()+1}</span>${fer?"<br><span style='color:#dc2626;font-size:9px'>FERIADO</span>":""}</div>`;}).join("")}`;
  users.forEach(u=>{
    html+=`<div class="wname"><div class="avatar sm">${initials(u.name)}</div>${esc(u.name)}</div>`;
    days.forEach(d=>{
      const iso=isoOfDate(d);

      html+=`<div class="weekcell" style="${fer?"background:#fef9f9":""}" onclick="${role==="jefe"&&u.id?`openWeekItem('${startISO}','${u.id}','${iso}')`:""}">
        ${items.map(i=>`<div class="wkitem ${i.done?"done":""} ${i.tag==="extra"?"extra":""}" onclick="event.stopPropagation();openWeekItem('${startISO}','${u.id}','${iso}','${i.id}')">${esc(i.text||"")}</div>`).join("")}
        ${role==="colaborador"&&u.id===state.user.uid&&!fer?`<button class="btn line sm" style="font-size:10px;padding:2px 6px;margin-top:auto" onclick="event.stopPropagation();openWeekItem('${startISO}','${state.user.uid}','${iso}',null,true)">+ Extra</button>`:""}
      </div>`;
    });
  });
  html+=`</div></div>`;
  return html;
}

/* ============ CALENDARIO ============ */
function viewCalendario(){
  const y=state.calYear,m=state.calMonth;
  const role=state.profile.role;
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  const offset=(first.getDay()+6)%7;
  const cells=[];for(let i=0;i<offset;i++)cells.push(null);
  for(let d=1;d<=last.getDate();d++)cells.push(new Date(y,m,d));
  while(cells.length%7)cells.push(null);
  const monthName=first.toLocaleDateString("es-PE",{month:"long",year:"numeric"});
  let html=ph("Calendario",role==="jefe"?"Vista del mes. Click en un día para ver el detalle. Click en + para marcar feriado.":"Vista del mes. Días verdes = con registro · Rojos = sin registro.");
  html+=`<div class="filterbar">
    <button class="btn line sm" onclick="state.calMonth--;if(state.calMonth<0){state.calMonth=11;state.calYear--}render()">◀</button>
    <b style="margin:0 12px;text-transform:capitalize">${monthName}</b>
    <button class="btn line sm" onclick="state.calMonth++;if(state.calMonth>11){state.calMonth=0;state.calYear++}render()">▶</button>
    <button class="btn line sm" onclick="const n=new Date();state.calMonth=n.getMonth();state.calYear=n.getFullYear();render()" style="margin-left:auto">Hoy</button>
  </div>
  <div class="cal">
    ${["LUN","MAR","MIÉ","JUE","VIE","SÁB","DOM"].map(d=>`<div class="cal-h">${d}</div>`).join("")}
    ${cells.map(d=>{
      if(!d)return `<div class="cal-d off"></div>`;
      const iso=isoOfDate(d);
      const fer=isHoliday(iso);
      const isToday=iso===todayISO();
      const dailyCount=data.daily.filter(x=>x.date===iso).length;
      const weeklyCount=data.weekly.filter(x=>x.date===iso).length;
      const myReg=data.daily.some(x=>x.date===iso&&x.userId===state.user.uid);
      const nolog=!myReg&&iso<todayISO()&&!fer&&d.getDay()!==0;
      return `<div class="cal-d ${fer?"fer":""} ${isToday?"tod":""} ${nolog?"nolog":""}" onclick="openCalDay('${iso}')">
        <div class="dn">${d.getDate()}</div>
        ${fer?`<div style="font-size:9px;color:#dc2626;font-weight:600">FERIADO</div>`:""}
        ${weeklyCount?`<div style="font-size:9px;color:var(--muted)">📋 ${weeklyCount}</div>`:""}
        ${dailyCount?`<div class="dl">✓ ${dailyCount} reg.</div>`:role==="colaborador"&&nolog?`<div class="dl">sin reg.</div>`:""}
      </div>`;
    }).join("")}
  </div>`;
  return html;
}

/* ============ DESEMPEÑO ============ */
function viewDesempeno(){
  const users=data.users.filter(u=>u.role!=="supervisor");
  const today=new Date();const thirtyAgo=new Date();thirtyAgo.setDate(today.getDate()-30);
  const thirtyAgoISO=isoOfDate(thirtyAgo);
  let html=ph("Desempeño del Equipo","Métricas individuales de los últimos 30 días: cumplimiento, horas, registros.");
  html+=`<div class="grid g2">`;
  users.forEach(u=>{
    const dailies=data.daily.filter(d=>d.userId===u.id&&d.date>=thirtyAgoISO);
    const weeklies=data.weekly.filter(w=>w.userId===u.id&&w.date>=thirtyAgoISO);
    const totalHours=dailies.reduce((a,d)=>a+(d.hours||0),0);
    const daysRegistered=new Set(dailies.map(d=>d.date)).size;
    const planned=weeklies.length;const completed=weeklies.filter(w=>w.done).length;
    const extras=weeklies.filter(w=>w.tag==="extra").length;
    const cumpl=planned?Math.round(completed/planned*100):0;
    const tasksAssigned=data.tasks.filter(t=>t.assigneeId===u.id);
    const avgProgress=tasksAssigned.length?Math.round(tasksAssigned.reduce((a,t)=>a+(t.pctReal||0),0)/tasksAssigned.length):0;
    html+=`<div class="card"><div class="card-h"><div class="avatar sm">${initials(u.name)}</div>${esc(u.name)} <span class="role ${u.role}" style="margin-left:auto">${ROLE_LABEL[u.role]}</span></div>
      <div class="card-b">
        <div class="grid g4" style="gap:8px">
          <div style="text-align:center;padding:8px;background:#f8fafc;border-radius:8px"><div style="font-family:var(--mono);font-size:18px;font-weight:700;color:var(--ink2)">${totalHours.toFixed(1)}</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase">Horas (30d)</div></div>
          <div style="text-align:center;padding:8px;background:#f8fafc;border-radius:8px"><div style="font-family:var(--mono);font-size:18px;font-weight:700;color:var(--ink2)">${daysRegistered}</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase">Días reg.</div></div>
          <div style="text-align:center;padding:8px;background:#f8fafc;border-radius:8px"><div style="font-family:var(--mono);font-size:18px;font-weight:700;color:${cumpl>=80?"var(--green)":cumpl>=50?"var(--amber)":"var(--red)"}">${cumpl}%</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase">Cumplim.</div></div>
          <div style="text-align:center;padding:8px;background:#f8fafc;border-radius:8px"><div style="font-family:var(--mono);font-size:18px;font-weight:700;color:var(--purple)">${extras}</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase">Extras</div></div>
        </div>
        <div style="margin-top:10px;font-size:12px;color:var(--muted)">
          <b>Frentes asignados:</b> ${tasksAssigned.length} · <b>Avance promedio:</b> ${avgProgress}%<br>
          <b>Planificado vs. completado:</b> ${completed}/${planned}
        </div>
        ${dailies.length===0?`<div class="alert warn" style="margin-top:10px;font-size:12px">⚠️ Sin registros en los últimos 30 días</div>`:""}
      </div></div>`;
  });
  html+=`</div>`;
  return html;
}

async function saveNewProject(){
  const mode=document.getElementById("np-mode").value;
  const code=val("np-code"),name=val("np-name");

  const status=document.getElementById("np-status").value;

  if(mode!=="observacion"&&!state._selTpl)return alert("Elige una plantilla.");
  try{
    const ref=await fb.fs.collection("projects").add(payload);
    addLog(`Creó expediente ${code} - ${name}`);
    if(mode!=="observacion"){
      const t=TEMPLATES[state._selTpl];
      for(let i=0;i<t.chapters.length;i++){

        const pct=valNum(`cap-pct-${i}`);
        const userId=document.getElementById(`cap-user-${i}`).value||null;
        const u=userId?uById(userId):null;
        await fb.fs.collection("tasks").add({projectId:ref.id,specialty:cap.name,capId:cap.id,assigneeId:userId,assigneeName:u?.name||"",pctReal:pct,entregables:[],kanbanCol:pct>=100?"done":pct>0?"doing":"todo",createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),updatedBy:state.profile.name});
      }
    }
    closeModal();
  }catch(e){alert("Error: "+e.message);}
}

}
async function saveEditProject(pid){
  const payload={code:val("ep-code"),name:val("ep-name"),location:val("ep-loc"),status:document.getElementById("ep-status").value,startDate:val("ep-start"),endDate:val("ep-end"),pauseReason:val("ep-pause"),driveLink:val("ep-drive"),updatedAt:new Date().toISOString()};
  try{await fb.fs.collection("projects").doc(pid).update(payload);addLog(`Editó expediente ${payload.code}`);closeModal();}catch(e){alert("Error: "+e.message);}
}
async function deleteProject(pid){
  if(!confirm("¿Eliminar este expediente y todos sus frentes? Esta acción no se puede deshacer."))return;
  try{
    const ts=data.tasks.filter(t=>t.projectId===pid);
    for(const t of ts)await fb.fs.collection("tasks").doc(t.id).delete();
    await fb.fs.collection("projects").doc(pid).delete();
    addLog(`Eliminó expediente ${pid}`);closeModal();
  }catch(e){alert("Error: "+e.message);}
}

function openAddTask(pid){
  const p=pById(pid);if(!p)return;
  const tpl=p.template?TEMPLATES[p.template]:null;
  const subOpts=tpl?tpl.chapters.flatMap(c=>c.subs?c.subs.map(s=>`${c.name} → ${s}`):[]).map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join(""):"";
  const userOpts=data.users.filter(u=>u.role!=="supervisor").map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("");
  document.getElementById("modal").innerHTML=`<div class="modal"><div class="modal-c">
    <div class="modal-h"><h3>+ Agregar frente de trabajo</h3><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <p style="color:var(--muted);font-size:13px;margin:0 0 12px">Expediente: <b>${esc(p.code)} · ${esc(p.name)}</b></p>
      <label class="fl"><span class="t">Nombre del frente / sub-inciso</span>
        ${subOpts?`<select id="at-sub-pick" onchange="document.getElementById('at-name').value=this.value"><option value="">— elegir de la plantilla —</option>${subOpts}</select><br><br>`:""}
        <input id="at-name" placeholder="Ej: Diseño de Pavimentos"/></label>
      <div class="grid g2">
        <label class="fl"><span class="t">Responsable</span><select id="at-user"><option value="">— sin asignar —</option>${userOpts}</select></label>
        <label class="fl"><span class="t">Fecha límite</span><input type="date" id="at-due"/></label>
      </div>
      <label class="fl"><span class="t">% inicial</span><input type="number" id="at-pct" min="0" max="100" value="0"/></label>
    </div>
    <div class="modal-f">
      <button class="btn primary" onclick="saveAddTask('${pid}')">Crear frente</button>
      <button class="btn line" onclick="closeModal()">Cancelar</button>
    </div>
  </div></div>`;
}
async function saveAddTask(pid){
  const name=val("at-name");if(!name)return alert("Escribe el nombre del frente.");
  const userId=document.getElementById("at-user").value||null;const u=userId?uById(userId):null;
  const pct=valNum("at-pct");
  try{await fb.fs.collection("tasks").add({projectId:pid,specialty:name,assigneeId:userId,assigneeName:u?.name||"",pctReal:pct,entregables:[],dueDate:val("at-due"),kanbanCol:pct>=100?"done":pct>0?"doing":"todo",createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),updatedBy:state.profile.name});addLog(`Agregó frente "${name}" a ${pById(pid).code}`);closeModal();}catch(e){alert("Error: "+e.message);}
}

function openNewKanban(){
  const userOpts=data.users.filter(u=>u.role!=="supervisor").map(u=>`<option value="${u.id}" ${u.id===state.user.uid?"selected":""}>${esc(u.name)}</option>`).join("");
  const projOpts=data.projects.filter(p=>p.status!=="cerrado").map(p=>`<option value="${p.id}">${esc(p.code)} · ${esc(p.name)}</option>`).join("");
  document.getElementById("modal").innerHTML=`<div class="modal"><div class="modal-c">
    <div class="modal-h"><h3>+ Nueva tarjeta en pizarra</h3><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <label class="fl"><span class="t">¿Qué hay que hacer?</span><input id="nk-name" placeholder="Describe la tarea"/></label>
      <div class="grid g2">
        <label class="fl"><span class="t">Expediente</span><select id="nk-proj"><option value="">— ninguno —</option>${projOpts}</select></label>
        <label class="fl"><span class="t">Responsable</span><select id="nk-user" ${state.profile.role!=="jefe"?"disabled":""}>${userOpts}</select></label>
        <label class="fl"><span class="t">Tipo</span><select id="nk-tag"><option value="extra">Extra (no planificada)</option><option value="plan">Planificada</option><option value="urg">Urgente</option><option value="obs">Observación</option></select></label>
        <label class="fl"><span class="t">Fecha límite</span><input type="date" id="nk-due"/></label>
      </div>
    </div>
    <div class="modal-f">
      <button class="btn primary" onclick="saveNewKanban()">Crear tarjeta</button>
      <button class="btn line" onclick="closeModal()">Cancelar</button>
    </div>
  </div></div>`;
}
async function saveNewKanban(){
  const name=val("nk-name");if(!name)return alert("Escribe la descripción.");
  const projectId=document.getElementById("nk-proj").value||null;
  const userId=document.getElementById("nk-user").value;const u=userId?uById(userId):null;
  const tag=document.getElementById("nk-tag").value;
  try{await fb.fs.collection("tasks").add({projectId:projectId||"kanban-libre",specialty:name,assigneeId:userId||state.user.uid,assigneeName:u?.name||state.profile.name,pctReal:0,entregables:[],dueDate:val("nk-due"),tag,kanbanCol:"todo",createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),updatedBy:state.profile.name});addLog(`Creó tarjeta en pizarra: "${name}"`);closeModal();}catch(e){alert("Error: "+e.message);}
}

/* ============ EVENTOS GLOBALES ============ */
function bindEvents(){
  document.getElementById("app").addEventListener("click",e=>{
    const b=e.target.closest("[data-act]");if(!b)return;
    const act=b.dataset.act,id=b.dataset.id;
    if(act==="tab"){state.tab=id;render();}
    else if(act==="logout")doLogout();
    else if(act==="refresh")render();
    else if(act==="authmode"){state.authMode=id;renderLogin();}
    else if(act==="login")doLogin();
    else if(act==="register")doRegister();
    else if(act==="pfilter"){state.projFilter=id;render();}
    else if(act==="newproj")openNewProject();
    else if(act==="editproj")openEditProject(id);
    else if(act==="addtask")openAddTask(id);
    else if(act==="opentask")openTask(id);
    else if(act==="newkanban")openNewKanban();
  });
}

/* ============ LOGIN ============ */
function renderLogin(){
  const mode=state.authMode;
  setApp(`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px"><div style="background:#fff;border-radius:14px;padding:28px;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(15,23,42,.08)">
    <div style="font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)">● Control · Expedientes Técnicos</div>
    <h1 style="font-size:22px;margin:6px 0 4px">Control de Avance</h1>
    <p style="color:var(--muted);font-size:14px">Ingresa con tu cuenta.</p>
    <div style="display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:18px 0">
      <button onclick="state.authMode='login';renderLogin()" style="flex:1;background:${mode==="login"?"var(--accent)":"#fff"};color:${mode==="login"?"#fff":"var(--muted)"};padding:9px">Iniciar sesión</button>
      <button onclick="state.authMode='register';renderLogin()" style="flex:1;background:${mode==="register"?"var(--accent)":"#fff"};color:${mode==="register"?"#fff":"var(--muted)"};padding:9px">Registrarme</button>
    </div>
    ${mode==="login"?`
      <label class="fl"><span class="t">Correo</span><input id="li-email" type="email"/></label>
      <label class="fl"><span class="t">Contraseña</span><input id="li-pass" type="password"/></label>
      <button class="btn primary" style="width:100%" data-act="login">Entrar</button>`:`
      <label class="fl"><span class="t">Nombre completo</span><input id="rg-name"/></label>
      <label class="fl"><span class="t">Correo</span><input id="rg-email" type="email"/></label>
      <label class="fl"><span class="t">Contraseña</span><input id="rg-pass" type="password" placeholder="mínimo 6 caracteres"/></label>
      <button class="btn primary" style="width:100%" data-act="register">Crear mi cuenta</button>`}
    <div id="authErr" style="color:#b91c1c;font-size:13px;margin-top:8px"></div>
  </div></div>`);
}
</script>
